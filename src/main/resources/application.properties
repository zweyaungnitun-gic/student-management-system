spring.application.name=student-management-system

# Database Configuration (from .env or environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_management_system}
 
# spring.datasource.url=jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres
# spring.datasource.username=postgres.ylwtjznomlnovobowcwl
# spring.datasource.password=Apple1234@
spring.datasource.driver-class-name=org.postgresql.Driver
 

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# Redis Configuration (from .env or environment variables)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Spring Session Configuration
spring.session.data.redis.flush-mode=on_save
spring.session.data.redis.namespace=sms:session
spring.session.timeout=1800

# JWT Configuration (HS512 requires 512 bits = 64 characters minimum)
# Prefer providing JWT_SECRET in your environment. The default below is for local dev only.
jwt.secret=${JWT_SECRET:dev-only-change-me-please-dev-only-change-me-please-0123456789abcdef0123456789abcdef}
jwt.expiration=86400000

# Spring Boot DevTools Configuration (Hot Reload)
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

