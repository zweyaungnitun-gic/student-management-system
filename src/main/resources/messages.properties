# Home Page (index.html)
home.title=GIC Career Gateway
home.hero.top=For Your Better Future
home.hero.title=GIC Career Gateway
home.hero.subtitle=Liberal Arts, IT & Japanese Language Training Center
home.hero.description=Take a Step to Your Future: Aim for a Career in Japan\u2019s IT Industry.\nBegin Your Journey by Learning the Latest Tech and Japanese Language Skills.
home.hero.register=REGISTER NOW

home.about.h3=GIC Career Gateway Supporting Modern IT Careers
home.about.h4=Introduction to GIC Career Gateway
home.about.p1=GIC Career Gateway was established in 2011 to develop IT professionals who can provide the best IT solutions for Myanmar. It is a training school founded by GIC Group and has been teaching students since 2013. GIC Group has been conducting international-standard training programs since 2011 and always prioritizes the success of its students. It supports students without IT skills to find their career paths.
home.about.p2=For those with IT skills and interests, those who have goals for their education and career paths, and those who want to pursue a career in the IT industry \u2013 scholarship programs are also available.
home.about.more=Learn More >>

home.who.h3=Who Is It For? Who Should Join?
home.who.h4=For all young people who want to go to Japan as IT professionals
home.who.item1=Recent graduates or those within 3 years of graduation
home.who.item2=Those interested in IT who have not yet graduated
home.who.item3=Those who want to start learning IT & Japanese from zero level
home.who.item4=Those with an IT background who want to switch to the IT field, or those with IT work experience who want to gain Japan experience
home.who.item5=Students who have graduated from language schools in Japan
home.who.item6=Those who want to work as IT Engineers in Japan

home.learn.h3=What Will You Learn?
home.learn.h4=Until you reach the IT workplace, GIC Career Gateway Japan IT Education & Bootcamp
home.learn.item1=Liberal Arts
home.learn.item2=IT Full Cycle Development Bootcamp
home.learn.item3=IT Workplace Japanese Language Training
home.learn.item4=On Job Training

home.why.h3=Why Choose GIC Career Gateway?
home.why.item1=A Liberal Arts, IT & Japanese Training Center founded by an IT company based in Tokyo, Japan
home.why.item2=After completing the course, we create opportunities to work within the GIC network of organizations
home.why.item3=GIC staff can support those who want to work in the GIC network to carry out OJT projects
home.why.item4=Unlike other schools, we teach from the basics to practical application
home.why.item5=Gain experience working in an actual workplace
home.why.item6=Not only for IT people, but also developing the skills, experience and intelligence that every IT professional should have

home.courses.h3=Courses Offered by GIC Career Gateway
home.courses.all1.title=All in One 2 Years Course
home.courses.all1.description=In this course, you will not only be taught IT subjects in Japanese from the basics but also to the point where you can actually use them in the workplace. In this course, you will be trained not only to graduate but also to pass the ITPPEC FE Exam, the national exam for Japan.
home.courses.more=Learn More >>
home.courses.ind1.title=Individual Course
home.courses.ind1.label=1) Full Cycle Development Bootcamp
home.courses.ind1.description=In this course, you will be trained step by step through the entire software development life cycle, from design to development, testing, operations & deployment, and maintenance & updates.
home.courses.ind2.title=Individual Course
home.courses.ind2.label=2) IT Japanese Bootcamp
home.courses.ind2.description=This course teaches IT workplace Japanese, which is essential for working as an IT professional in Japan.

home.career.h3=Career Path with Career Gateway
home.career.description=After completing the course at GIC Career Gateway, you can join the GIC company as an intern. During the internship period, the company will also provide a salary of 100,000 kyats plus transportation costs. The internship period will last 6 months. After the internship period, if there are no issues after evaluation by the company, you will be hired. In addition, we will also introduce you to other partner Japanese IT companies that match your skills, so you will be able to find employment.

