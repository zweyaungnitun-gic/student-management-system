<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layouts/admin-layout :: head(pageTitle=#{course.details} + ' | ' + #{app.title})}">
</head>

<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage='courses')}"></th:block>

        <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

        <div class="dashboard-main">
            <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
                <!-- Page Header -->
                <div class="page-header mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light btn-icon d-lg-none" type="button" aria-label="Toggle sidebar"
                            data-sidebar-toggle>
                            <i class="bi bi-list fs-4"></i>
                        </button>
                        <div>
                            <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem;" th:text="#{course.details}">
                                コース詳細
                            </h1>
                            <p class="text-muted mb-0" th:text="#{course.code} + ': ' + ${course.courseCode}"></p>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-2 mb-4">
                    <a href="/courses" class="btn btn-outline-secondary d-flex align-items-center gap-2">
                        <i class="bi bi-arrow-left"></i>
                        <span th:text="#{course.back.to.list}">一覧に戻る</span>
                    </a>
                    <a th:href="@{'/courses/edit/' + ${course.courseId}}" 
                       class="btn btn-primary d-flex align-items-center gap-2"
                       sec:authorize="hasRole('ADMIN')">
                        <i class="bi bi-pencil-square"></i>
                        <span th:text="#{course.edit}">編集</span>
                    </a>
                </div>

                <!-- Course Information Card -->
                <div class="row">
                    <div class="col-md-5 mb-4">
                        <div class="card shadow-sm h-100">
                            <div class="card-header bg-white py-3">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-info-circle me-2 text-primary"></i>
                                    <span th:text="#{course.information}">コース情報</span>
                                </h5>
                            </div>
                            <div class="card-body">
                                <table class="table table-borderless">
                                    <tr>
                                        <th class="ps-0 text-muted" style="width: 120px;" th:text="#{course.id}">ID</th>
                                        <td class="fw-semibold" th:text="${course.courseId}"></td>
                                    </tr>
                                    <tr>
                                        <th class="ps-0 text-muted" th:text="#{course.code}">コースコード</th>
                                        <td>
                                            <span class="badge bg-secondary bg-opacity-10 text-secondary px-3 py-2 rounded-pill"
                                                  th:text="${course.courseCode}"></span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="ps-0 text-muted" th:text="#{course.name}">コース名</th>
                                        <td th:text="${course.courseName}"></td>
                                    </tr>
                                    <tr>
                                        <th class="ps-0 text-muted" th:text="#{course.description}">説明</th>
                                        <td th:text="${course.description} ?: '-'"></td>
                                    </tr>
                                    <tr>
                                        <th class="ps-0 text-muted" th:text="#{course.credits}">単位数</th>
                                        <td>
                                            <span class="badge bg-info bg-opacity-10 text-info px-3 py-2 rounded-pill"
                                                  th:text="${course.creditHours} + '単位'"></span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="ps-0 text-muted" th:text="#{course.teacher}">担当教師</th>
                                        <td>
                                            <span th:if="${course.teacherName}" 
                                                  th:text="${course.teacherName}"
                                                  class="fw-semibold"></span>
                                            <span th:unless="${course.teacherName}" class="text-muted fst-italic" th:text="#{app.not.assigned}">未割当</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="ps-0 text-muted" th:text="#{course.status}">ステータス</th>
                                        <td>
                                            <span th:if="${course.isActive}" 
                                                  class="badge bg-success rounded-pill px-3 py-2" th:text="#{course.active}">アクティブ</span>
                                            <span th:unless="${course.isActive}" 
                                                  class="badge bg-danger rounded-pill px-3 py-2" th:text="#{course.inactive}">非アクティブ</span>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th class="ps-0 text-muted" th:text="#{app.created.date}">登録日</th>
                                        <td th:text="${#temporals.format(course.createdAt, 'yyyy年MM月dd日 HH:mm')}"></td>
                                    </tr>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-7 mb-4">
                        <div class="card shadow-sm h-100">
                            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center">
                                    <i class="bi bi-people me-2 text-success"></i>
                                    <h5 class="card-title mb-0" th:text="#{course.enrolled.students}">受講生徒一覧</h5>
                                </div>
                                <div class="d-flex align-items-center gap-2">
                                    <span class="badge bg-success rounded-pill" th:text="${enrollments.size()} + '名'"></span>
                                    <a th:href="@{'/courses/export/' + ${course.courseId}}" 
                                    class="btn btn-sm btn-outline-success d-flex align-items-center gap-1"
                                    title="Excelダウンロード">
                                        <i class="bi bi-file-earmark-excel"></i>
                                        <span class="d-none d-md-inline">Excel</span>
                                    </a>
                                </div>
                            </div>
                            
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="bg-light">
                                            <tr>
                                                <th class="ps-4" th:text="#{courses.details.auto_7ea9}">生徒ID</th>
                                                <th th:text="#{courses.details.auto_08b8}">氏名</th>
                                                <th th:text="#{courses.details.auto_54dd}">ステータス</th>
                                                <th th:text="#{courses.details.auto_b7e7}">入学日</th>
                                                <th class="text-center" th:text="#{courses.details.auto_2b6b}">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="enrollment : ${enrollments}">
                                                <td class="ps-4">
                                                    <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill"
                                                          th:text="${enrollment.studentId}"></span>
                                                </td>
                                                <td th:text="${enrollment.studentName}"></td>
                                                <td>
                                                    <span th:if="${enrollment.status == '在校'}" 
                                                          class="badge bg-success bg-opacity-10 text-success rounded-pill px-3" th:text="#{courses.details.auto_ed9f}">在校</span>
                                                    <span th:if="${enrollment.status == '卒業'}" 
                                                          class="badge bg-info bg-opacity-10 text-info rounded-pill px-3" th:text="#{courses.details.auto_bff7}">卒業</span>
                                                    <span th:if="${enrollment.status == '休学'}" 
                                                          class="badge bg-warning bg-opacity-10 text-warning rounded-pill px-3" th:text="#{courses.details.auto_2e34}">休学</span>
                                                    <span th:if="${enrollment.status == '退学'}" 
                                                          class="badge bg-danger bg-opacity-10 text-danger rounded-pill px-3" th:text="#{courses.details.auto_e51e}">退学</span>
                                                </td>
                                                <td th:text="${#temporals.format(enrollment.enrollmentDate, 'yyyy/MM/dd')}"></td>
                                                <td class="text-center">
                                                    <a th:href="@{'/students/detail/' + ${enrollment.studentId}}" 
                                                       class="btn btn-sm btn-outline-info"
                                                       title="生徒詳細">
                                                        <i class="bi bi-person"></i>
                                                    </a>
                                                    <a th:href="@{'/results/student/' + ${enrollment.studentId}}" 
                                                       class="btn btn-sm btn-outline-secondary"
                                                       title="成績一覧">
                                                        <i class="bi bi-bar-chart"></i>
                                                    </a>
                                                </td>
                                            </tr>
                                            <tr th:if="${enrollments.size() == 0}">
                                                <td colspan="5" class="text-center text-muted py-4">
                                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i><th:block th:text="#{courses.details.auto_9ac0}">受講している生徒はいません</th:block></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

<!-- Statistics Cards -->
<div class="row g-4">
    <div class="col-md-3">
        <div class="card shadow-sm border-0 bg-primary bg-opacity-10">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div class="flex-shrink-0">
                        <i class="bi bi-people fs-2 text-primary"></i>
                    </div>
                    <div class="flex-grow-1 ms-3">
                        <h6 class="text-muted mb-1" th:text="#{courses.details.auto_7b19}">受講生徒数</h6>
                        <h3 class="mb-0 fw-bold" th:text="${enrollments.size()}">0</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-3">
        <div class="card shadow-sm border-0 bg-success bg-opacity-10">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div class="flex-shrink-0">
                        <i class="bi bi-check-circle fs-2 text-success"></i>
                    </div>
                    <div class="flex-grow-1 ms-3">
                        <h6 class="text-muted mb-1" th:text="#{courses.details.auto_275e}">在校生</h6>
                        <h3 class="mb-0 fw-bold" 
                            th:text="${#aggregates.sum(enrollments.![status == '在校' ? 1 : 0])}">0</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-3">
        <div class="card shadow-sm border-0 bg-info bg-opacity-10">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div class="flex-shrink-0">
                        <i class="bi bi-file-text fs-2 text-info"></i>
                    </div>
                    <div class="flex-grow-1 ms-3">
                        <h6 class="text-muted mb-1" th:text="#{courses.details.auto_7a4c}">テスト数</h6>
                        <h3 class="mb-0 fw-bold" th:text="${tests.size()}">0</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="col-md-3">
        <div class="card shadow-sm border-0 bg-warning bg-opacity-10">
            <div class="card-body">
                <div class="d-flex align-items-center">
                    <div class="flex-shrink-0">
                        <i class="bi bi-star fs-2 text-warning"></i>
                    </div>
                    <div class="flex-grow-1 ms-3">
                        <h6 class="text-muted mb-1" th:text="#{courses.details.auto_6314}">平均点</h6>
                        <h3 class="mb-0 fw-bold" th:text="${averageScore != null ? #numbers.formatDecimal(averageScore, 1, 2) : '-'}">-</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const layout = document.querySelector(".dashboard-layout");
            const toggles = document.querySelectorAll("[data-sidebar-toggle]");
            toggles.forEach((btn) =>
                btn.addEventListener("click", function (event) {
                    event.preventDefault();
                    layout?.classList.toggle("sidebar-open");
                })
            );
        });
    </script>
</body>
</html>
