<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layouts/admin-layout :: head(pageTitle='コース管理 | 生徒情報管理システム')}">
</head>

<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage='courses')}"></th:block>

        <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

        <div class="dashboard-main">
            <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
                <!-- Page Header with toggle button -->
                <div class="page-header mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light btn-icon d-lg-none" type="button" aria-label="Toggle sidebar"
                            data-sidebar-toggle>
                            <i class="bi bi-list fs-4"></i>
                        </button>
                        <div>
                            <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem;">
                                コース管理
                            </h1>
                        </div>
                    </div>
                </div>

                <!-- Search, Filter, and Action Buttons Section -->
                <div class="card mb-4 shadow-sm">
                    <div class="card-body">
                        <div class="row g-3">
                            <!-- Search and Filter - Left side -->
                            <div class="col-md-8">
                                <form th:action="@{/courses}" method="get" class="row g-3">
                                    <div class="col-md-7">
                                        <div class="input-group">
                                            <span class="input-group-text bg-white">
                                                <i class="bi bi-search"></i>
                                            </span>
                                            <input type="text" class="form-control" name="search" th:value="${search}"
                                                   placeholder="コース名またはコードで検索...">
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <div class="form-check mt-2">
                                            <input type="checkbox" class="form-check-input" name="activeOnly" 
                                                   th:checked="${activeOnly}" id="activeOnly">
                                            <label class="form-check-label" for="activeOnly">アクティブのみ表示</label>
                                        </div>
                                    </div>
                                    <div class="col-md-2">
                                        <button type="submit" class="btn btn-primary w-100">
                                            <i class="bi bi-search me-2"></i>検索
                                        </button>
                                    </div>
                                </form>
                            </div>
                            
                            <!-- Action Buttons - Right side -->
                            <div class="col-md-4">
                                <div class="d-flex gap-2 justify-content-end">

                                    <a href="/courses/add" class="btn btn-success d-flex align-items-center gap-2" 
                                       sec:authorize="hasRole('ADMIN')">
                                        <i class="bi bi-plus-circle"></i>
                                        <span>新規追加</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Success/Error Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Courses Table -->
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="courseTable">
                                <thead class="bg-primary text-white">
                                    <tr>
                                        <th class="text-center">ID</th>
                                        <th class="text-center">コースコード</th>
                                        <th class="text-center">コース名</th>
                                        <th class="text-center">単位数</th>
                                        <th class="text-center">担当教師</th>
                                        <th class="text-center">ステータス</th>
                                        <th class="text-center">登録日</th>
                                        <th class="text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="courseTableBody">
                                    <tr th:each="course : ${courses}">
                                        <td class="text-center" th:text="${course.courseId}"></td>
                                        <td class="text-center">
                                            <span class="badge bg-secondary bg-opacity-10 text-secondary px-3 py-2 rounded-pill"
                                                  th:text="${course.courseCode}"></span>
                                        </td>
                                        <td th:text="${course.courseName}"></td>
                                        <td class="text-center" th:text="${course.creditHours}"></td>
                                        <td class="text-center">
                                            <span th:if="${course.teacherName}" th:text="${course.teacherName}"></span>
                                            <span th:unless="${course.teacherName}" class="text-muted fst-italic">未割当</span>
                                        </td>
                                        <td class="text-center">
                                            <span th:if="${course.isActive}" class="badge bg-success rounded-pill px-3">アクティブ</span>
                                            <span th:unless="${course.isActive}" class="badge bg-danger rounded-pill px-3">非アクティブ</span>
                                        </td>
                                        <td class="text-center" th:text="${#temporals.format(course.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td class="text-center">
                                            <div class="d-flex gap-3 justify-content-center align-items-center">
                                                <!-- Detail Button -->
                                                <a th:href="@{'/courses/' + ${course.courseId}}" 
                                                class="text-decoration-none text-info" 
                                                title="詳細"
                                                style="font-size: 1.2rem;">
                                                    <i class="bi bi-info-circle"></i>
                                                </a>
                                                
                                                <!-- Edit Button -->
                                                <a th:href="@{'/courses/edit/' + ${course.courseId}}" 
                                                class="text-decoration-none text-primary" 
                                                title="編集"
                                                sec:authorize="hasRole('ADMIN')"
                                                style="font-size: 1.2rem;">
                                                    <i class="bi bi-pencil-square"></i>
                                                </a>
                                                
                                                <!-- Toggle Active/Inactive Button -->
                                                <form th:action="@{'/courses/toggle/' + ${course.courseId}}" 
                                                    method="post" 
                                                    style="display: inline;">
                                                    <button type="submit" 
                                                            class="text-decoration-none text-warning bg-transparent border-0 p-0" 
                                                            th:title="${course.isActive} ? '非アクティブ化' : 'アクティブ化'"
                                                            sec:authorize="hasRole('ADMIN')"
                                                            style="font-size: 1.2rem; cursor: pointer;">
                                                        <i class="bi bi-arrow-repeat"></i>
                                                    </button>
                                                </form>
                                                
                                                <!-- Delete Button -->
                                                <a th:href="@{'/courses/delete/' + ${course.courseId}}" 
                                                class="text-decoration-none text-danger" 
                                                title="削除"
                                                sec:authorize="hasRole('ADMIN')"
                                                onclick="return confirm('このコースを削除してもよろしいですか？');"
                                                style="font-size: 1.2rem;">
                                                    <i class="bi bi-trash-fill"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${courses.size() == 0}">
                                        <td colspan="8" class="text-center text-muted py-5">
                                            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                                            コースが登録されていません。
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div id="pagination" class="d-flex justify-content-center mt-4 pagination"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Pagination Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Sidebar toggle
            const layout = document.querySelector(".dashboard-layout");
            const toggles = document.querySelectorAll("[data-sidebar-toggle]");
            toggles.forEach((btn) =>
                btn.addEventListener("click", function (event) {
                    event.preventDefault();
                    layout?.classList.toggle("sidebar-open");
                })
            );

            // Pagination
            const rows = Array.from(document.querySelectorAll("#courseTableBody tr")).filter(
                r => !r.querySelector("td[colspan]")
            );
            
            if (rows.length === 0) return;
            
            const rowsPerPage = 10;
            let currentPage = 1;
            
            function displayPage(page) {
                currentPage = page;
                const start = (page - 1) * rowsPerPage;
                const end = start + rowsPerPage;
                
                rows.forEach((row, index) => {
                    row.style.display = index >= start && index < end ? "" : "none";
                });
                
                renderPagination();
            }
            
            function renderPagination() {
                const pageCount = Math.ceil(rows.length / rowsPerPage);
                const paginationDiv = document.getElementById("pagination");
                
                paginationDiv.innerHTML = "";
                
                // Previous button
                const prevBtn = document.createElement("button");
                prevBtn.innerHTML = "&laquo;";
                prevBtn.className = `btn btn-sm mx-1 ${currentPage === 1 ? 'btn-secondary' : 'btn-outline-primary'}`;
                prevBtn.disabled = currentPage === 1;
                prevBtn.addEventListener("click", () => displayPage(currentPage - 1));
                paginationDiv.appendChild(prevBtn);
                
                // Page numbers
                let startPage = Math.max(1, currentPage - 2);
                let endPage = Math.min(pageCount, currentPage + 2);
                
                if (endPage - startPage < 4) {
                    if (currentPage < 3) {
                        endPage = Math.min(pageCount, 5);
                    } else {
                        startPage = Math.max(1, pageCount - 4);
                    }
                }
                
                for (let i = startPage; i <= endPage; i++) {
                    const btn = document.createElement("button");
                    btn.textContent = i;
                    btn.className = `btn btn-sm mx-1 ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}`;
                    btn.addEventListener("click", () => displayPage(i));
                    paginationDiv.appendChild(btn);
                }
                
                // Next button
                const nextBtn = document.createElement("button");
                nextBtn.innerHTML = "&raquo;";
                nextBtn.className = `btn btn-sm mx-1 ${currentPage === pageCount ? 'btn-secondary' : 'btn-outline-primary'}`;
                nextBtn.disabled = currentPage === pageCount;
                nextBtn.addEventListener("click", () => displayPage(currentPage + 1));
                paginationDiv.appendChild(nextBtn);
            }
            
            displayPage(1);
        });
    </script>
</body>
</html>
