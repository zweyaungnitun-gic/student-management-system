<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>コース管理 - 生徒情報管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .container-fluid { padding: 20px; }
        .table thead th { background-color: #0F6CBD; color: white; }
        .action-icon { cursor: pointer; padding: 0 0.25rem; transition: color 0.2s; }
        .action-icon.edit { color: #0d6efd; }
        .action-icon.delete { color: #dc3545; }
        .action-icon.toggle { color: #198754; }
        .action-icon:hover { opacity: 0.8; }
        .badge-active { background-color: #198754; }
        .badge-inactive { background-color: #dc3545; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-book-fill me-2"></i>コース管理</h2>
            <a href="/courses/add" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>新規コース追加
            </a>
        </div>

        <!-- Search Form -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/courses}" method="get" class="row g-3">
                    <div class="col-md-8">
                        <input type="text" class="form-control" name="search" th:value="${search}" 
                               placeholder="コース名またはコードで検索...">
                    </div>
                    <div class="col-md-2">
                        <div class="form-check mt-2">
                            <input type="checkbox" class="form-check-input" name="activeOnly" 
                                   th:checked="${activeOnly}" id="activeOnly">
                            <label class="form-check-label" for="activeOnly">アクティブのみ表示</label>
                        </div>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search me-2"></i>検索
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Courses Table -->
        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>コースコード</th>
                            <th>コース名</th>
                            <th>単位数</th>
                            <th>担当教師</th>
                            <th>ステータス</th>
                            <th>登録日</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="course : ${courses}">
                            <td th:text="${course.courseId}"></td>
                            <td th:text="${course.courseCode}"></td>
                            <td th:text="${course.courseName}"></td>
                            <td th:text="${course.creditHours}"></td>
                            <td>
                                <span th:if="${course.teacherName}" th:text="${course.teacherName}"></span>
                                <span th:unless="${course.teacherName}" class="text-muted">未割当</span>
                            </td>
                            <td>
                                <span th:if="${course.isActive}" class="badge badge-active bg-success">アクティブ</span>
                                <span th:unless="${course.isActive}" class="badge badge-inactive bg-danger">非アクティブ</span>
                            </td>
                            <td th:text="${#temporals.format(course.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <a th:href="@{'/courses/edit/' + ${course.courseId}}" class="action-icon edit" title="編集">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <form th:action="@{'/courses/toggle/' + ${course.courseId}}" method="post" style="display: inline;">
                                    <button type="submit" class="action-icon toggle btn btn-link p-0 border-0" 
                                            th:title="${course.isActive} ? '非アクティブ化' : 'アクティブ化'">
                                        <i class="bi bi-arrow-repeat"></i>
                                    </button>
                                </form>
                                <a th:href="@{'/courses/delete/' + ${course.courseId}}" class="action-icon delete" title="削除"
                                   onclick="return confirm('このコースを削除してもよろしいですか？');">
                                    <i class="bi bi-trash-fill"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${courses.size() == 0}">
                            <td colspan="8" class="text-center text-muted py-4">
                                コースが登録されていません。
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3">
            <a href="/students" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-2"></i>生徒管理に戻る
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
