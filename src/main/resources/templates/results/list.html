<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layouts/admin-layout :: head(pageTitle='テスト結果一覧 | 生徒情報管理システム')}">
</head>

<body>
    <div class="dashboard-layout">
        <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage='results')}"></th:block>

        <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

        <div class="dashboard-main">
            <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
                <!-- Page Header -->
                <div class="page-header mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light btn-icon d-lg-none" type="button" data-sidebar-toggle>
                            <i class="bi bi-list fs-4"></i>
                        </button>
                        <div>
                            <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem;">
                                テスト結果一覧
                            </h1>
                        </div>
                    </div>
                </div>

                <!-- Search and Filter -->
                <div class="card mb-4 shadow-sm">
                    <div class="card-body">
                        <form th:action="@{/results}" method="get" class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">テスト選択</label>
                                <select name="testId" class="form-select">
                                    <option value="">全てのテスト</option>
                                    <option th:each="test : ${tests}" 
                                            th:value="${test.testId}"
                                            th:text="${test.testName} + ' (' + ${test.courseName} + ')'"
                                            th:selected="${param.testId == test.testId}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">生徒名検索</label>
                                <input type="text" class="form-control" name="studentName" 
                                       th:value="${param.studentName}" placeholder="生徒名で検索">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">コース</label>
                                <select name="courseId" class="form-select">
                                    <option value="">全てのコース</option>
                                    <option th:each="course : ${courses}" 
                                            th:value="${course.courseId}"
                                            th:text="${course.courseName}"
                                            th:selected="${param.courseId == course.courseId}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-12 text-end">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-search me-2"></i>検索
                                </button>
                                <a href="/results" class="btn btn-outline-secondary">
                                    <i class="bi bi-arrow-repeat me-2"></i>クリア
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end gap-2 mb-4">
                    <a href="/results/add" class="btn btn-success" sec:authorize="hasRole('ADMIN') or hasRole('TEACHER')">
                        <i class="bi bi-plus-circle me-2"></i>新規結果入力
                    </a>
                    <a href="/results/bulk-upload" class="btn btn-info" sec:authorize="hasRole('ADMIN')">
                        <i class="bi bi-file-spreadsheet me-2"></i>一括アップロード
                    </a>
                </div>

                <!-- Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Results Table -->
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-primary text-white">
                                    <tr>
                                        <th>ID</th>
                                        <th>テスト名</th>
                                        <th>生徒名</th>
                                        <th>コース</th>
                                        <th class="text-center">得点/満点</th>
                                        <th class="text-center">%</th>
                                        <th class="text-center">評価</th>
                                        <th class="text-center">GPA</th>
                                        <th class="text-center">結果</th>
                                        <th class="text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="result : ${results}">
                                        <td th:text="${result.testResultId}"></td>
                                        <td th:text="${result.testName}"></td>
                                        <td>
                                            <a th:href="@{'/students/detail/' + ${result.studentId}}" 
                                               class="text-decoration-none" th:text="${result.studentName}"></a>
                                        </td>
                                        <td th:text="${result.courseName}"></td>
                                        <td class="text-center" th:text="${result.scoreObtained} + '/' + ${result.totalMarks}"></td>
                                        <td class="text-center" th:text="${#numbers.formatDecimal(result.percentage, 1, 1)} + '%'"></td>
                                        <td class="text-center">
                                            <span class="badge" th:classappend="${result.grade == 'A' or result.grade == 'A+' ? 'bg-success' : 
                                                                                 (result.grade == 'F' ? 'bg-danger' : 'bg-info')}"
                                                  th:text="${result.grade}"></span>
                                        </td>
                                        <td class="text-center" th:text="${result.gpa}"></td>
                                        <td class="text-center">
                                            <span th:if="${result.result == '合格'}" class="badge bg-success">合格</span>
                                            <span th:if="${result.result == '不合格'}" class="badge bg-danger">不合格</span>
                                        </td>
                                        <td class="text-center">
                                            <div class="btn-group btn-group-sm">
                                                <a th:href="@{'/results/edit/' + ${result.testResultId}}" 
                                                   class="btn btn-outline-primary" title="編集">
                                                    <i class="bi bi-pencil"></i>
                                                </a>
                                                <a th:href="@{'/reports/student/' + ${result.studentId}}" 
                                                   class="btn btn-outline-info" title="成績表">
                                                    <i class="bi bi-file-text"></i>
                                                </a>
                                                <a th:href="@{'/results/delete/' + ${result.testResultId}}" 
                                                   class="btn btn-outline-danger" title="削除"
                                                   onclick="return confirm('この結果を削除してもよろしいですか？');">
                                                    <i class="bi bi-trash"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${results == null or results.size() == 0}">
                                        <td colspan="10" class="text-center text-muted py-5">
                                            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                                            テスト結果がありません。
                                            <div class="mt-3">
                                                <a href="/results/add" class="btn btn-primary">
                                                    <i class="bi bi-plus-circle me-2"></i>最初の結果を入力
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4">
                    <nav>
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                                <a class="page-link" th:href="@{/results(page=${currentPage - 1}, testId=${param.testId}, studentName=${param.studentName}, courseId=${param.courseId})}">前へ</a>
                            </li>
                            <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" 
                                th:classappend="${i == currentPage} ? 'active'">
                                <a class="page-link" th:href="@{/results(page=${i}, testId=${param.testId}, studentName=${param.studentName}, courseId=${param.courseId})}" th:text="${i}"></a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/results(page=${currentPage + 1}, testId=${param.testId}, studentName=${param.studentName}, courseId=${param.courseId})}">次へ</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const layout = document.querySelector(".dashboard-layout");
            const toggles = document.querySelectorAll("[data-sidebar-toggle]");
            toggles.forEach((btn) =>
                btn.addEventListener("click", function (event) {
                    event.preventDefault();
                    layout?.classList.toggle("sidebar-open");
                })
            );
        });
    </script>
</body>
</html>
