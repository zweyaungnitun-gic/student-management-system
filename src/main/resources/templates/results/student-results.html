<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/admin-layout :: head(pageTitle='学生のテスト結果')}">
</head>

<body>
    <div class="dashboard-layout">
        <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage='results')}"></th:block>

        <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

        <div class="dashboard-main">
            <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
                <!-- Page Header -->
                <div class="page-header mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light btn-icon d-lg-none" type="button" data-sidebar-toggle>
                            <i class="bi bi-list fs-4"></i>
                        </button>
                        <div>
                            <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem;">
                                学生のテスト結果
                            </h1>
                            <p class="text-muted mb-0" th:if="${student != null}" 
                               th:text="${student.studentName} + ' (' + ${student.studentId} + ')'"></p>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex justify-content-end align-items-center mb-4 gap-2">
                    <!-- Back Button -->
                    <a href="javascript:history.back()" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i>戻る
                    </a>
                    
                    <!-- Excel Download Button -->
                    <button type="button" id="excelDownloadBtn" class="btn btn-success" onclick="exportToExcel()">
                        <i class="bi bi-file-earmark-excel me-2"></i>Excelダウンロード
                    </button>
                    
                    <!-- Add Result Button -->
                    <a th:href="@{'/results/add?studentId=' + ${student.id}}" 
                    class="btn btn-primary"
                    sec:authorize="hasRole('ADMIN') or hasRole('TEACHER')">
                        <i class="bi bi-plus-circle me-2"></i>結果追加
                    </a>
                </div>

                <!-- Results Table -->
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="resultsTable">
                                <thead class="bg-primary text-white">
                                    <tr>
                                        <th>テスト名</th>
                                        <th>コース</th>
                                        <th class="text-center">得点/満点</th>
                                        <th class="text-center">%</th>
                                        <th class="text-center">評価</th>
                                        <th class="text-center">GPA</th>
                                        <th class="text-center">結果</th>
                                        <th class="text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="resultsTableBody">
                                    <tr th:each="result : ${results}">
                                        <td th:text="${result.testName}"></td>
                                        <td th:text="${result.courseName}"></td>
                                        <td class="text-center" th:text="${result.scoreObtained} + '/' + ${result.totalMarks}"></td>
                                        <td class="text-center">
                                            <span th:if="${result.percentage != null}" 
                                                th:text="${#numbers.formatDecimal(result.percentage, 1, 1)} + '%'"></span>
                                            <span th:if="${result.percentage == null}">-</span>
                                        </td>
                                        <td class="text-center">
                                            <span class="badge" 
                                                th:classappend="${result.grade == 'A' or result.grade == 'A+' ? 'bg-success' : 
                                                                (result.grade == 'F' ? 'bg-danger' : 
                                                                    (result.grade != null ? 'bg-info' : 'bg-secondary'))}"
                                                th:text="${result.grade != null ? result.grade : '-'}"></span>
                                        </td>
                                        <td class="text-center" th:text="${result.gpa != null ? result.gpa : '-'}"></td>
                                        <td class="text-center">
                                            <span th:if="${result.result == '合格'}" class="badge bg-success">合格</span>
                                            <span th:if="${result.result == '不合格'}" class="badge bg-danger">不合格</span>
                                            <span th:if="${result.result == null}" class="badge bg-secondary">-</span>
                                        </td>
                                        <td class="text-center">
                                            <a th:href="@{'/results/edit/' + ${result.testResultId}}" 
                                               class="btn btn-sm btn-outline-primary" title="編集">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${results == null or results.size() == 0}">
                                        <td colspan="8" class="text-center text-muted py-5">
                                            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                                            この学生のテスト結果はありません。
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div th:if="${totalPages > 1}" class="d-flex justify-content-center mt-4">
                    <nav aria-label="Page navigation">
                        <ul class="pagination">
                            <!-- Previous button -->
                            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/results/student/{studentId}(studentId=${studentId}, page=${currentPage - 1})}" 
                                th:unless="${currentPage == 1}">
                                    <i class="bi bi-chevron-left"></i> 前へ
                                </a>
                                <span class="page-link" th:if="${currentPage == 1}">
                                    <i class="bi bi-chevron-left"></i> 前へ
                                </span>
                            </li>
                            
                            <!-- Page numbers - show only up to 5 pages -->
                            <li class="page-item" th:each="pageNum : ${#numbers.sequence(1, totalPages)}" 
                                th:if="${pageNum >= currentPage - 2 and pageNum <= currentPage + 2}"
                                th:classappend="${pageNum == currentPage} ? 'active' : ''">
                                <a class="page-link" th:href="@{/results/student/{studentId}(studentId=${studentId}, page=${pageNum})}" 
                                th:text="${pageNum}"></a>
                            </li>
                            
                            <!-- Next button -->
                            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled' : ''">
                                <a class="page-link" th:href="@{/results/student/{studentId}(studentId=${studentId}, page=${currentPage + 1})}" 
                                th:unless="${currentPage == totalPages}">
                                    次へ <i class="bi bi-chevron-right"></i>
                                </a>
                                <span class="page-link" th:if="${currentPage == totalPages}">
                                    次へ <i class="bi bi-chevron-right"></i>
                                </span>
                            </li>
                        </ul>
                    </nav>
                </div>

                <!-- Results count info -->
                <div class="text-center text-muted small mt-2" th:if="${totalResults > 0}">
                    表示: <span th:text="${results.size()}"></span>件 / 全<span th:text="${totalResults}"></span>件
                </div>
            </div>
        </div>
    </div>

    <!-- Include SheetJS for Excel export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function() {
            // Sidebar toggle
            const layout = document.querySelector(".dashboard-layout");
            const toggles = document.querySelectorAll("[data-sidebar-toggle]");
            toggles.forEach((btn) =>
                btn.addEventListener("click", function (event) {
                    event.preventDefault();
                    layout?.classList.toggle("sidebar-open");
                })
            );

           // ============ PAGINATION ============
            const rows = Array.from(document.querySelectorAll("#resultsTable tbody tr")).filter(
                r => !r.querySelector("td[colspan]")
            );

            const rowsPerPage = 10;
            let currentPage = 1;

            function displayPage(page) {
                currentPage = page;
                const start = (page - 1) * rowsPerPage;
                const end = Math.min(start + rowsPerPage, rows.length);
                
                // Hide all rows first
                rows.forEach(row => {
                    row.style.display = "none";
                });
                
                // Show only current page rows
                for (let i = start; i < end; i++) {
                    if (rows[i]) {
                        rows[i].style.display = "";
                    }
                }
                
                renderPagination();
                updateResultsCount(start, end);
            }

            function renderPagination() {
                const pageCount = Math.ceil(rows.length / rowsPerPage);
                const paginationDiv = document.getElementById("pagination");
                if (!paginationDiv) return;
                
                paginationDiv.innerHTML = "";
                
                if (rows.length <= rowsPerPage) {
                    return;
                }
                
                // Previous button
                const prevBtn = document.createElement("button");
                prevBtn.innerHTML = "&laquo;";
                prevBtn.className = `btn btn-sm mx-1 ${currentPage === 1 ? 'btn-secondary' : 'btn-outline-primary'}`;
                prevBtn.disabled = currentPage === 1;
                prevBtn.addEventListener("click", () => displayPage(currentPage - 1));
                paginationDiv.appendChild(prevBtn);
                
                // Page numbers
                let startPage = Math.max(1, currentPage - 2);
                let endPage = Math.min(pageCount, currentPage + 2);
                
                for (let i = startPage; i <= endPage; i++) {
                    const btn = document.createElement("button");
                    btn.textContent = i;
                    btn.className = `btn btn-sm mx-1 ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}`;
                    btn.addEventListener("click", () => displayPage(i));
                    paginationDiv.appendChild(btn);
                }
                
                // Next button
                const nextBtn = document.createElement("button");
                nextBtn.innerHTML = "&raquo;";
                nextBtn.className = `btn btn-sm mx-1 ${currentPage === pageCount ? 'btn-secondary' : 'btn-outline-primary'}`;
                nextBtn.disabled = currentPage === pageCount;
                nextBtn.addEventListener("click", () => displayPage(currentPage + 1));
                paginationDiv.appendChild(nextBtn);
            }

            function updateResultsCount(start, end) {
                const countInfo = document.getElementById("resultsCountInfo");
                if (countInfo) {
                    countInfo.textContent = `表示: ${start + 1}-${Math.min(end, rows.length)}件 / 全${rows.length}件`;
                }
            }

            // Initialize pagination
            if (rows.length > 0) {
                displayPage(1);
            } else {
                document.getElementById("pagination").innerHTML = "";
                const countInfo = document.getElementById("resultsCountInfo");
                if (countInfo) countInfo.innerHTML = "全0件";
            }
            // ============ EXCEL DOWNLOAD ============
            function exportToExcel() {
                const table = document.getElementById("resultsTable");
                const rows = table.querySelectorAll("tbody tr");
                
                if (rows.length === 0 || (rows.length === 1 && rows[0].querySelector("td[colspan]"))) {
                    alert("エクスポートするデータがありません。");
                    return;
                }
                
                const studentNameElement = document.querySelector(".text-muted.mb-0");
                const studentName = studentNameElement ? studentNameElement.textContent.split('(')[0].trim() : "学生";
                
                const excelData = [];
                
                excelData.push(["テスト名", "コース", "得点", "満点", "パーセンテージ", "評価", "GPA", "結果", "フィードバック"]);
                
                rows.forEach(function(row) {
                    if (row.querySelector("td[colspan]")) return;
                    
                    const cells = row.querySelectorAll("td");
                    if (cells.length >= 8) {
                        const testName = cells[0].textContent.trim();
                        const courseName = cells[1].textContent.trim();
                        const scoreText = cells[2].textContent.trim().split('/');
                        const score = scoreText[0] || "";
                        const totalMarks = scoreText[1] || "";
                        const percentage = cells[3].textContent.trim().replace('%', '');
                        const grade = cells[4].textContent.trim();
                        const gpa = cells[5].textContent.trim();
                        const result = cells[6].textContent.trim();
                        const feedback = ""; 
                        excelData.push([testName, courseName, score, totalMarks, percentage, grade, gpa, result, feedback]);
                    }
                });
                
                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.aoa_to_sheet(excelData);
                
                ws['!cols'] = [
                    { wch: 30 }, { wch: 25 }, { wch: 10 }, { wch: 10 }, 
                    { wch: 15 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 40 }
                ];
                
                XLSX.utils.book_append_sheet(wb, ws, "テスト結果");
                
                const timestamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
                const filename = `テスト結果_${studentName}_${timestamp}.xlsx`;
                
                XLSX.writeFile(wb, filename);
            }
        });
    </script>
</body>
</html>
