<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layouts/admin-layout :: head(pageTitle=#{student.update.title} + ' | ' + #{app.title})}">
    <title>生徒情報編集</title>
  </head>

  <body>
    <div class="dashboard-layout">
      <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage=${'students'})}"></th:block>
      <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

      <div class="dashboard-main">
        <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
          <!-- Header -->
          <div class="d-flex align-items-center gap-3 mb-4">
            <button class="btn btn-light btn-icon d-lg-none" type="button" aria-label="Toggle sidebar" data-sidebar-toggle>
              <i class="bi bi-list fs-4"></i>
            </button>
            <div>
              <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem">
                <i class="bi bi-person-gear me-2"></i>生徒情報編集
              </h1>
              <div class="text-muted mt-1">
                <span class="fw-semibold" th:text="${student.studentId}">STU001</span>
                <span class="mx-2">|</span>
                <span th:text="${student.studentName}">山田太郎</span>
              </div>
            </div>
            <div class="ms-auto d-flex gap-2">
              <a th:href="@{/students/detail/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> 詳細へ戻る
              </a>
              <a th:href="@{/students(nameSearch=${nameSearch}, status=${status})}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-list"></i> 生徒一覧
              </a>
            </div>
          </div>

          <!-- Alert Messages -->
          <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${success}">更新しました</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
          <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${error}">エラーが発生しました</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>

          <!-- Tabs Navigation -->
          <ul class="nav nav-tabs mb-4" id="studentUpdateTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link" th:classappend="${activeTab == null || activeTab == 'basic'} ? 'active' : ''"
                      id="basic-tab" data-bs-toggle="tab" data-bs-target="#basic-panel" type="button" role="tab">
                <i class="bi bi-person-vcard me-1"></i>基本情報
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" th:classappend="${activeTab == 'status'} ? 'active' : ''"
                      id="status-tab" data-bs-toggle="tab" data-bs-target="#status-panel" type="button" role="tab">
                <i class="bi bi-card-list me-1"></i>追加情報・ステータス
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" th:classappend="${activeTab == 'interview'} ? 'active' : ''"
                      id="interview-tab" data-bs-toggle="tab" data-bs-target="#interview-panel" type="button" role="tab">
                <i class="bi bi-chat-left-text me-1"></i>面接メモ
              </button>
            </li>
          </ul>

          <!-- Tab Content -->
          <div class="tab-content" id="studentUpdateTabContent">
            
            <!-- Basic Information Tab -->
            <div class="tab-pane fade" th:classappend="${activeTab == null || activeTab == 'basic'} ? 'show active' : ''"
                 id="basic-panel" role="tabpanel">
              <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                  <h5 class="mb-0"><i class="bi bi-person-vcard me-2 text-primary"></i>基本情報</h5>
                </div>
                <div class="card-body">
                  <form th:action="@{/students/update-basic/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" 
                        method="post" th:object="${student}">
                    <input type="hidden" name="nameSearch" th:value="${nameSearch}" />
                    <input type="hidden" name="status" th:value="${status}" />
                    
                    <div class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">
                          生徒ID <span class="text-muted">(自動生成)</span>
                        </label>
                        <input type="text" class="form-control bg-light" th:field="*{studentId}" readonly />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">
                          氏名 <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" th:field="*{studentName}" required />
                        <div th:if="${#fields.hasErrors('studentName')}" class="text-danger small mt-1" th:errors="*{studentName}"></div>
                      </div>

                      <div class="col-md-6">
                        <label class="form-label fw-semibold">氏名（カタカナ）</label>
                        <input type="text" class="form-control" th:field="*{nameInJapanese}" placeholder="ヤマダタロウ" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">父親名</label>
                        <input type="text" class="form-control" th:field="*{fatherName}" />
                      </div>

                      <div class="col-md-4">
                        <label class="form-label fw-semibold">
                          生年月日 <span class="text-danger">*</span>
                        </label>
                        <input type="date" class="form-control" th:field="*{dateOfBirth}" required />
                      </div>
                      <div class="col-md-4">
                        <label class="form-label fw-semibold">
                          性別 <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" th:field="*{gender}" required>
                          <option value="">選択してください</option>
                          <option value="男性">男性</option>
                          <option value="女性">女性</option>
                          <option value="その他">その他</option>
                        </select>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label fw-semibold">国民ID番号</label>
                        <input type="text" class="form-control" th:field="*{nationalId}" />
                        <div th:if="${#fields.hasErrors('nationalId')}" class="text-danger small mt-1" th:errors="*{nationalId}"></div>
                      </div>

                      <div class="col-md-6">
                        <label class="form-label fw-semibold">
                          電話番号 <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" th:field="*{phoneNumber}" required />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">Viber連絡先</label>
                        <input type="text" class="form-control" th:field="*{contactViber}" />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label fw-semibold">パスポート番号</label>
                        <input type="text" class="form-control" th:field="*{passportNumber}" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">2番目の連絡先</label>
                        <input type="text" class="form-control" th:field="*{secondaryPhone}" />
                      </div>

                      <div class="col-12">
                        <label class="form-label fw-semibold">現住所</label>
                        <textarea class="form-control" rows="2" th:field="*{currentLivingAddress}"></textarea>
                      </div>
                      <div class="col-12">
                        <label class="form-label fw-semibold">出身地住所</label>
                        <textarea class="form-control" rows="2" th:field="*{homeTownAddress}"></textarea>
                      </div>

                      <div class="col-md-6">
                        <label class="form-label fw-semibold">宗教</label>
                        <input type="text" class="form-control" th:field="*{religion}" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">学校登録日</label>
                        <input type="date" class="form-control" th:field="*{enrolledDate}" />
                      </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                      <a th:href="@{/students/detail/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> キャンセル
                      </a>
                      <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> 基本情報を保存
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <!-- Status/Additional Info Tab -->
            <div class="tab-pane fade" th:classappend="${activeTab == 'status'} ? 'show active' : ''"
                 id="status-panel" role="tabpanel">
              <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                  <h5 class="mb-0"><i class="bi bi-card-list me-2 text-warning"></i>追加情報・ステータス</h5>
                </div>
                <div class="card-body">
                  <form th:action="@{/students/update-status/{id}(id=${student.id}, nameSearch=${nameSearch}, filterStatus=${status})}" 
                        method="post" th:object="${student}">
                    <input type="hidden" name="nameSearch" th:value="${nameSearch}" />
                    <input type="hidden" name="filterStatus" th:value="${status}" />
                    
                    <div class="row g-3">
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">在籍ステータス</label>
                        <select class="form-select" th:field="*{status}">
                          <option value="">選択してください</option>
                          <option value="在校">在校</option>
                          <option value="卒業">卒業</option>
                          <option value="途中退校">途中退校</option>
                        </select>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">授業関連ステータス</label>
                        <input type="text" class="form-control" th:field="*{attendingClassRelatedStatus}" />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label fw-semibold">希望職種</label>
                        <select class="form-select" th:field="*{desiredJobType}">
                          <option value="">選択してください</option>
                          <option value="製造業">製造業</option>
                          <option value="建設業">建設業</option>
                          <option value="介護">介護</option>
                          <option value="農業">農業</option>
                          <option value="漁業">漁業</option>
                          <option value="外食業">外食業</option>
                          <option value="その他">その他</option>
                        </select>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">その他希望職種</label>
                        <input type="text" class="form-control" th:field="*{otherDesiredJobType}" placeholder="その他を選択した場合" />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label fw-semibold">現在の日本語レベル</label>
                        <select class="form-select" th:field="*{currentJapanLevel}">
                          <option value="">選択してください</option>
                          <option value="N5">N5</option>
                          <option value="N4">N4</option>
                          <option value="N3">N3</option>
                          <option value="N2">N2</option>
                          <option value="N1">N1</option>
                        </select>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">合格済み最高JLPTレベル</label>
                        <select class="form-select" th:field="*{passedHighestJlptLevel}">
                          <option value="">選択してください</option>
                          <option value="N5">N5</option>
                          <option value="N4">N4</option>
                          <option value="N3">N3</option>
                          <option value="N2">N2</option>
                          <option value="N1">N1</option>
                        </select>
                      </div>

                      <div class="col-md-6">
                        <label class="form-label fw-semibold">日本渡航経験</label>
                        <select class="form-select" th:field="*{japanTravelExperience}">
                          <option th:value="${null}">未選択</option>
                          <option th:value="${true}">あり</option>
                          <option th:value="${false}">なし</option>
                        </select>
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">COE申請経験</label>
                        <select class="form-select" th:field="*{coeApplicationExperience}">
                          <option th:value="${null}">未選択</option>
                          <option th:value="${true}">あり</option>
                          <option th:value="${false}">なし</option>
                        </select>
                      </div>

                      <div class="col-md-4">
                        <label class="form-label fw-semibold">寮があれば入りたい</label>
                        <select class="form-select" th:field="*{hostelPreference}">
                          <option th:value="${null}">未選択</option>
                          <option th:value="${true}">はい</option>
                          <option th:value="${false}">いいえ</option>
                        </select>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label fw-semibold">タバコ</label>
                        <select class="form-select" th:field="*{isSmoking}">
                          <option th:value="${null}">未選択</option>
                          <option th:value="${true}">吸う</option>
                          <option th:value="${false}">吸わない</option>
                        </select>
                      </div>
                      <div class="col-md-4">
                        <label class="form-label fw-semibold">お酒</label>
                        <select class="form-select" th:field="*{isAlcoholDrink}">
                          <option th:value="${null}">未選択</option>
                          <option th:value="${true}">飲む</option>
                          <option th:value="${false}">飲まない</option>
                        </select>
                      </div>

                      <div class="col-md-4">
                        <label class="form-label fw-semibold">入れ墨</label>
                        <select class="form-select" th:field="*{haveTatto}">
                          <option th:value="${null}">未選択</option>
                          <option th:value="${true}">ある</option>
                          <option th:value="${false}">ない</option>
                        </select>
                      </div>

                      <div class="col-md-6">
                        <label class="form-label fw-semibold">その他宗教</label>
                        <input type="text" class="form-control" th:field="*{otherReligion}" />
                      </div>

                      <div class="col-md-6">
                        <label class="form-label fw-semibold">授業料支払予定日</label>
                        <input type="date" class="form-control" th:field="*{schedulePaymentTutionDate}" />
                      </div>
                      <div class="col-md-6">
                        <label class="form-label fw-semibold">授業料支払実績日</label>
                        <input type="date" class="form-control" th:field="*{actualTutionPaymentDate}" />
                      </div>

                      <div class="col-12">
                        <label class="form-label fw-semibold">メモ・備考</label>
                        <textarea class="form-control" rows="4" th:field="*{memoNotes}" placeholder="自由形式でメモを入力"></textarea>
                      </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                      <a th:href="@{/students/detail/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> キャンセル
                      </a>
                      <button type="submit" class="btn btn-warning text-dark">
                        <i class="bi bi-save"></i> 追加情報を保存
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <!-- Interview Notes Tab -->
            <div class="tab-pane fade" th:classappend="${activeTab == 'interview'} ? 'show active' : ''"
                 id="interview-panel" role="tabpanel">
              <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                  <h5 class="mb-0"><i class="bi bi-chat-left-text me-2 text-success"></i>面接メモ</h5>
                </div>
                <div class="card-body">
                  <form th:action="@{/students/update-interview/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" 
                        method="post" th:object="${interviewNotes}">
                    <input type="hidden" name="nameSearch" th:value="${nameSearch}" />
                    <input type="hidden" name="status" th:value="${status}" />
                    
                    <div class="row g-3">
                      <div class="col-12">
                        <label class="form-label fw-semibold">
                          <span class="badge bg-primary me-2">1回目</span>一回目面接メモ
                        </label>
                        <textarea class="form-control" rows="6" th:field="*{interview1}" placeholder="一回目の面接内容を記入"></textarea>
                      </div>

                      <div class="col-12">
                        <label class="form-label fw-semibold">
                          <span class="badge bg-info me-2">2回目</span>二回目面接メモ
                        </label>
                        <textarea class="form-control" rows="6" th:field="*{interview2}" placeholder="二回目の面接内容を記入"></textarea>
                      </div>

                      <div class="col-12">
                        <label class="form-label fw-semibold">
                          <span class="badge bg-secondary me-2">3回目</span>三回目面接メモ
                        </label>
                        <textarea class="form-control" rows="6" th:field="*{interview3}" placeholder="三回目の面接内容を記入"></textarea>
                      </div>

                      <div class="col-12">
                        <label class="form-label fw-semibold">
                          <i class="bi bi-sticky me-1"></i>その他メモ・備考
                        </label>
                        <textarea class="form-control" rows="4" th:field="*{otherMemo}" placeholder="その他のメモや備考"></textarea>
                      </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                      <a th:href="@{/students/detail/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> キャンセル
                      </a>
                      <button type="submit" class="btn btn-success">
                        <i class="bi bi-save"></i> 面接メモを保存
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Handle URL hash for direct tab navigation
      document.addEventListener('DOMContentLoaded', function() {
        const hash = window.location.hash;
        if (hash) {
          const tabId = hash.substring(1); // Remove #
          const tabButton = document.getElementById(tabId + '-tab');
          if (tabButton) {
            const tab = new bootstrap.Tab(tabButton);
            tab.show();
          }
        }
      });
    </script>
  </body>
</html>
