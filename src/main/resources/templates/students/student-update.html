<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layouts/admin-layout :: head(pageTitle=#{student.update.title} + ' | ' + #{app.title})}">
    <title>生徒情報編集</title>
</head>
<style>
    /* Custom styles for student update page */
    .form-section {
        background: white;
        border-radius: 20px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        margin-bottom: 2rem;
        overflow: hidden;
        transition: all 0.3s ease;
    }
    .form-section:hover {
        box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }
    .section-header {
        background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
        padding: 1.25rem 1.5rem;
        border-bottom: 2px solid #e9ecef;
    }
    .section-header h5 {
        margin: 0;
        font-weight: 600;
        color: #1e3c72;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }
    .section-header h5 i {
        font-size: 1.25rem;
        color: #0d6efd;
    }
    .form-body {
        padding: 1.75rem;
    }
    .form-label {
        font-weight: 500;
        color: #495057;
        margin-bottom: 0.5rem;
        font-size: 0.9rem;
    }
    .form-label.required::after {
        content: "*";
        color: #dc3545;
        margin-left: 4px;
    }
    .form-control, .form-select {
        border: 1px solid #e0e4e8;
        border-radius: 10px;
        padding: 0.625rem 0.875rem;
        transition: all 0.2s ease;
    }
    .form-control:focus, .form-select:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 3px rgba(13,110,253,0.1);
    }
    .input-group-text {
        background: #f8f9fa;
        border: 1px solid #e0e4e8;
        border-radius: 10px 0 0 10px;
    }
    .action-buttons {
        position: sticky;
        bottom: 1rem;
        background: white;
        padding: 1.25rem 1.5rem;
        border-radius: 16px;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
        margin-top: 2rem;
        z-index: 10;
    }
    .info-badge {
        background: #f0f7ff;
        padding: 0.5rem 1rem;
        border-radius: 12px;
        font-size: 0.85rem;
        color: #0a58a0;
    }
    .divider {
        border-top: 1px solid #e9ecef;
        margin: 1.5rem 0;
    }
    .radio-group {
        display: flex;
        gap: 1.5rem;
        align-items: center;
        padding: 0.5rem 0;
    }
    .radio-group .form-check {
        margin: 0;
    }
    .status-badge {
        padding: 0.5rem 1rem;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 500;
    }
    .status-badge.enrolled { background: #d1fae5; color: #065f46; }
    .status-badge.graduated { background: #fed7aa; color: #92400e; }
    .status-badge.dropped { background: #fee2e2; color: #991b1b; }
    @media (max-width: 768px) {
        .form-body { padding: 1.25rem; }
        .section-header { padding: 1rem 1.25rem; }
    }

    .nav-tabs .nav-link {
    transition: all 0.2s ease;
    font-weight: 500;
    }

    .nav-tabs .nav-link.active {
        background: #0d6efd !important;
        color: white !important;
        border: none;
    }

    .nav-tabs .nav-link:not(.active) {
        background: #f8f9fa;
        color: #6c757d;
        border: none;
    }

    .nav-tabs .nav-link:not(.active):hover {
        background: #e9ecef;
        color: #0d6efd;
    }
</style>

<body>
    <div class="dashboard-layout">
        <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage=${'students'})}"></th:block>
        <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

        <div class="dashboard-main">
            <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
                <!-- Header -->
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light btn-icon d-lg-none" type="button" data-sidebar-toggle>
                            <i class="bi bi-list fs-4"></i>
                        </button>
                        <div>
                            <h1 class="mb-0" style="color: #0a58a0; font-weight: 700; font-size: 1.8rem;">
                                <i class="bi bi-pencil-square me-2"></i>生徒情報編集
                            </h1>
                            <div class="d-flex align-items-center gap-3 mt-2">
                                <span class="info-badge">
                                    <i class="bi bi-person-badge me-1"></i>
                                    <span th:text="${student.studentId}">STU001</span>
                                </span>
                                <span class="info-badge">
                                    <i class="bi bi-person me-1"></i>
                                    <span th:text="${student.studentName}">山田太郎</span>
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/students/detail/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" 
                           class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> 詳細へ戻る
                        </a>
                        <a th:href="@{/students(nameSearch=${nameSearch}, status=${status})}" 
                           class="btn btn-outline-primary">
                            <i class="bi bi-list me-1"></i> 生徒一覧
                        </a>
                    </div>
                </div>

                <!-- Alert Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${success}">更新しました</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}">エラーが発生しました</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Tabs Navigation -->
                <ul class="nav nav-tabs mb-4 border-0 gap-2" id="studentUpdateTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link px-4 py-2 rounded-3" 
                                th:classappend="${activeTab == null || activeTab == 'basic'} ? 'active' : ''"
                                id="basic-tab" data-bs-toggle="tab" data-bs-target="#basic-panel" type="button" role="tab">
                            <i class="bi bi-person-vcard me-2"></i>基本情報
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link px-4 py-2 rounded-3" 
                                th:classappend="${activeTab == 'status'} ? 'active' : ''"
                                id="status-tab" data-bs-toggle="tab" data-bs-target="#status-panel" type="button" role="tab">
                            <i class="bi bi-card-list me-2"></i>追加情報
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link px-4 py-2 rounded-3" 
                                th:classappend="${activeTab == 'interview'} ? 'active' : ''"
                                id="interview-tab" data-bs-toggle="tab" data-bs-target="#interview-panel" type="button" role="tab">
                            <i class="bi bi-chat-left-text me-2"></i>面接メモ
                        </button>
                    </li>
                </ul>

                <!-- Tab Content -->
                <div class="tab-content" id="studentUpdateTabContent">
                    
                    <!-- ========== BASIC INFORMATION TAB ========== -->
                    <div class="tab-pane fade" th:classappend="${activeTab == null || activeTab == 'basic'} ? 'show active' : ''"
                         id="basic-panel" role="tabpanel">
                        <form th:action="@{/students/update-basic/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" 
                              method="post" th:object="${student}">
                            <input type="hidden" name="nameSearch" th:value="${nameSearch}" />
                            <input type="hidden" name="status" th:value="${status}" />
                            
                            <div class="form-section">
                                <div class="section-header">
                                    <h5><i class="bi bi-person-circle"></i> 個人情報</h5>
                                </div>
                                <div class="form-body">
                                    <div class="row g-4">
                                        <div class="col-md-6">
                                            <label class="form-label required">生徒ID</label>
                                            <input type="text" class="form-control bg-light" th:field="*{studentId}" readonly />
                                            <!-- <small class="text-muted">自動生成されたIDです</small> -->
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label required">氏名</label>
                                            <input type="text" class="form-control" th:field="*{studentName}" required />
                                            <div th:if="${#fields.hasErrors('studentName')}" class="text-danger small mt-1" th:errors="*{studentName}"></div>
                                        </div>

                                        <div class="col-md-6">
                                            <label class="form-label">氏名（カタカナ）</label>
                                            <input type="text" class="form-control" th:field="*{nameInJapanese}" placeholder="ヤマダ タロウ" />
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">父親名</label>
                                            <input type="text" class="form-control" th:field="*{fatherName}" placeholder="佐藤 一郎" />
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label required">性別</label>
                                            <select class="form-select" th:field="*{gender}" required>
                                                <option value="">選択してください</option>
                                                <option value="男性">男性</option>
                                                <option value="女性">女性</option>
                                                <option value="その他">その他</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label required">生年月日</label>
                                            <input type="date" class="form-control" 
                                                  th:value="${student.dateOfBirth != null ? #temporals.format(student.dateOfBirth, 'yyyy-MM-dd') : ''}" 
                                                  th:field="*{dateOfBirth}" required />
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">宗教</label>
                                            <input type="text" class="form-control" th:field="*{religion}" placeholder="仏教 / イスラム教 / キリスト教" />
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label required">国民ID番号</label>
                                            <input type="text" class="form-control" th:field="*{nationalId}" required placeholder="12/ThaPhaYa(N)123456" />
                                            <div th:if="${#fields.hasErrors('nationalId')}" class="text-danger small mt-1" th:errors="*{nationalId}"></div>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">パスポート番号</label>
                                            <input type="text" class="form-control" th:field="*{passportNumber}" placeholder="MA123456" />
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">学校登録日</label>
                                            <input type="date" class="form-control" 
                                                  th:value="${student.enrolledDate != null ? #temporals.format(student.enrolledDate, 'yyyy-MM-dd') : ''}" 
                                                  th:field="*{enrolledDate}" />
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label required">電話番号</label>
                                            <input type="tel" class="form-control" th:field="*{phoneNumber}" required placeholder="09012345678" />
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">Viber連絡先</label>
                                            <input type="text" class="form-control" th:field="*{contactViber}" placeholder="Viber ID" />
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">保護者電話番号</label>
                                            <input type="tel" class="form-control" th:field="*{secondaryPhone}" placeholder="09012345678" />
                                        </div>

                                        <div class="col-12">
                                            <label class="form-label">現住所</label>
                                            <textarea class="form-control" rows="2" th:field="*{currentLivingAddress}" placeholder="東京都新宿区西新宿1-1-1"></textarea>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">出身地住所</label>
                                            <textarea class="form-control" rows="2" th:field="*{homeTownAddress}" placeholder="神奈川県横浜市青葉区1-2-3"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="action-buttons">
                                <div class="d-flex justify-content-end gap-3">
                                    <a th:href="@{/students/detail/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" 
                                       class="btn btn-outline-secondary px-4 py-2">
                                        <i class="bi bi-x-circle me-2"></i>キャンセル
                                    </a>
                                    <button type="submit" class="btn btn-primary px-4 py-2">
                                        <i class="bi bi-save me-2"></i>基本情報を保存
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- ========== STATUS & ADDITIONAL INFO TAB ========== -->
                    <div class="tab-pane fade" th:classappend="${activeTab == 'status'} ? 'show active' : ''"
                         id="status-panel" role="tabpanel">
                        <form th:action="@{/students/update-status/{id}(id=${student.id}, nameSearch=${nameSearch}, filterStatus=${status})}" 
                              method="post" th:object="${student}">
                            <input type="hidden" name="nameSearch" th:value="${nameSearch}" />
                            <input type="hidden" name="filterStatus" th:value="${status}" />
                            
                            <div class="form-section">
                                <div class="section-header">
                                    <h5><i class="bi bi-flag"></i> ステータス情報</h5>
                                </div>
                                <div class="form-body">
                                    <div class="row g-4">
                                        <div class="col-md-6">
                                            <label class="form-label required">在籍ステータス</label>
                                            <select class="form-select" th:field="*{status}">
                                                <option value="">選択してください</option>
                                                <option value="在校">在校</option>
                                                <option value="卒業">卒業</option>
                                                <option value="途中退校">途中退校</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">授業関連ステータス</label>
                                            <input type="text" class="form-control" th:field="*{attendingClassRelatedStatus}" placeholder="N5 / N4 / N3" />
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">現在の日本語レベル</label>
                                            <select class="form-select" th:field="*{currentJapanLevel}">
                                                <option value="">選択してください</option>
                                                <option value="N5">N5</option>
                                                <option value="N4">N4</option>
                                                <option value="N3">N3</option>
                                                <option value="N2">N2</option>
                                                <option value="N1">N1</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">合格済み最高JLPTレベル</label>
                                            <select class="form-select" th:field="*{passedHighestJlptLevel}">
                                                <option value="">選択してください</option>
                                                <option value="N5">N5</option>
                                                <option value="N4">N4</option>
                                                <option value="N3">N3</option>
                                                <option value="N2">N2</option>
                                                <option value="N1">N1</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section">
                                <div class="section-header">
                                    <h5><i class="bi bi-briefcase"></i> 就職情報</h5>
                                </div>
                                <div class="form-body">
                                    <div class="row g-4">
                                        <div class="col-md-6">
                                            <label class="form-label">希望職種</label>
                                            <select class="form-select" th:field="*{desiredJobType}">
                                                <option value="">選択してください</option>
                                                <option value="製造業">製造業</option>
                                                <option value="建設業">建設業</option>
                                                <option value="介護">介護</option>
                                                <option value="農業">農業</option>
                                                <option value="漁業">漁業</option>
                                                <option value="外食業">外食業</option>
                                                <option value="その他">その他</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">その他希望職種</label>
                                            <input type="text" class="form-control" th:field="*{otherDesiredJobType}" placeholder="その他を選択した場合" />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section">
                                <div class="section-header">
                                    <h5><i class="bi bi-info-square"></i> その他情報</h5>
                                </div>
                                <div class="form-body">
                                    <div class="row g-4">
                                        <!-- First Row: Experience Fields -->
                                        <div class="col-md-4">
                                            <label class="form-label">日本渡航経験</label>
                                            <select class="form-select" th:field="*{japanTravelExperience}">
                                                <option th:value="${null}">選択してください</option>
                                                <option th:value="true">あり</option>
                                                <option th:value="false">なし</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">寮希望</label>
                                            <select class="form-select" th:field="*{hostelPreference}">
                                                <option th:value="${null}">選択してください</option>
                                                <option th:value="true">はい</option>
                                                <option th:value="false">いいえ</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">その他宗教</label>
                                            <input type="text" class="form-control" th:field="*{otherReligion}" placeholder="その他宗教を選択した場合" />
                                        </div>

                                        <!-- Second Row: Preferences -->
                                        <div class="col-md-4">
                                            <label class="form-label">COE申請経験</label>
                                            <select class="form-select" th:field="*{coeApplicationExperience}">
                                                <option th:value="${null}">選択してください</option>
                                                <option th:value="true">あり</option>
                                                <option th:value="false">なし</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">タバコ</label>
                                            <select class="form-select" th:field="*{isSmoking}">
                                                <option th:value="${null}">選択してください</option>
                                                <option th:value="true">吸う</option>
                                                <option th:value="false">吸わない</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">お酒</label>
                                            <select class="form-select" th:field="*{isAlcoholDrink}">
                                                <option th:value="${null}">選択してください</option>
                                                <option th:value="true">飲む</option>
                                                <option th:value="false">飲まない</option>
                                            </select>
                                        </div>

                                        <!-- Third Row: Tattoo and Dates -->
                                        <div class="col-md-4">
                                            <label class="form-label">入れ墨</label>
                                            <select class="form-select" th:field="*{haveTatto}">
                                                <option th:value="${null}">選択してください</option>
                                                <option th:value="true">ある</option>
                                                <option th:value="false">ない</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">授業料支払予定日</label>
                                            <input type="date" class="form-control" 
                                                  th:value="${student.schedulePaymentTutionDate != null ? #temporals.format(student.schedulePaymentTutionDate, 'yyyy-MM-dd') : ''}" 
                                                  th:field="*{schedulePaymentTutionDate}" />
                                        </div>
                                        <div class="col-md-4">
                                            <label class="form-label">授業料支払実績日</label>
                                            <input type="date" class="form-control" 
                                                  th:value="${student.actualTutionPaymentDate != null ? #temporals.format(student.actualTutionPaymentDate, 'yyyy-MM-dd') : ''}" 
                                                  th:field="*{actualTutionPaymentDate}" />
                                        </div>

                                        <!-- Fourth Row: Religion and Memo -->
                                        <div class="col-12">
                                            <label class="form-label">メモ・備考</label>
                                            <textarea class="form-control" rows="3" th:field="*{memoNotes}" placeholder="自由形式でメモを入力してください"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="action-buttons">
                                <div class="d-flex justify-content-end gap-3">
                                    <a th:href="@{/students/detail/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" 
                                       class="btn btn-outline-secondary px-4 py-2">
                                        <i class="bi bi-x-circle me-2"></i>キャンセル
                                    </a>
                                    <button type="submit" class="btn btn-warning px-4 py-2">
                                        <i class="bi bi-save me-2"></i>追加情報を保存
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>

                    <!-- ========== INTERVIEW NOTES TAB ========== -->
                    <div class="tab-pane fade" th:classappend="${activeTab == 'interview'} ? 'show active' : ''"
                         id="interview-panel" role="tabpanel">
                        <form th:action="@{/students/update-interview/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" 
                              method="post" th:object="${interviewNotes}">
                            <input type="hidden" name="nameSearch" th:value="${nameSearch}" />
                            <input type="hidden" name="status" th:value="${status}" />
                            
                            <div class="form-section">
                                <div class="section-header">
                                    <h5><i class="bi bi-chat-dots"></i> 面接記録</h5>
                                </div>
                                <div class="form-body">
                                    <div class="row g-4">
                                        <div class="col-12">
                                            <label class="form-label">
                                                <span class="badge bg-primary me-2">1回目</span>一回目面接メモ
                                            </label>
                                            <textarea class="form-control" rows="4" th:field="*{interview1}" 
                                                      placeholder="一回目の面接内容を記入してください"></textarea>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">
                                                <span class="badge bg-info me-2">2回目</span>二回目面接メモ
                                            </label>
                                            <textarea class="form-control" rows="4" th:field="*{interview2}" 
                                                      placeholder="二回目の面接内容を記入してください"></textarea>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">
                                                <span class="badge bg-secondary me-2">3回目</span>三回目面接メモ
                                            </label>
                                            <textarea class="form-control" rows="4" th:field="*{interview3}" 
                                                      placeholder="三回目の面接内容を記入してください"></textarea>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">
                                                <i class="bi bi-sticky me-2"></i>その他メモ・備考
                                            </label>
                                            <textarea class="form-control" rows="3" th:field="*{otherMemo}" 
                                                      placeholder="その他のメモや備考"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="action-buttons">
                                <div class="d-flex justify-content-end gap-3">
                                    <a th:href="@{/students/detail/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}" 
                                       class="btn btn-outline-secondary px-4 py-2">
                                        <i class="bi bi-x-circle me-2"></i>キャンセル
                                    </a>
                                    <button type="submit" class="btn btn-success px-4 py-2">
                                        <i class="bi bi-save me-2"></i>面接メモを保存
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Handle URL hash for direct tab navigation
        document.addEventListener('DOMContentLoaded', function() {
            const hash = window.location.hash;
            if (hash) {
                const tabId = hash.substring(1);
                const tabButton = document.getElementById(tabId + '-tab');
                if (tabButton) {
                    const tab = new bootstrap.Tab(tabButton);
                    tab.show();
                }
            }
        });
    </script>
</body>
</html>
