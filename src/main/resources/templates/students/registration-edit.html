<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layouts/admin-layout :: head(pageTitle=#{registration.edit} + ' | ' + #{app.title})}"></head>

  <body>
    <div class="dashboard-layout">
      <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage=${'registrations'})}"></th:block>
      <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

      <div class="dashboard-main">
        <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
          <div class="d-flex align-items-center gap-3 mb-3">
            <button class="btn btn-light btn-icon d-lg-none" type="button" aria-label="Toggle sidebar" data-sidebar-toggle>
              <i class="bi bi-list fs-4"></i>
            </button>
            <div>
              <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem" th:text="#{registration.edit}">登録申請編集</h1>
              <div class="text-muted mt-1">
                <span class="fw-semibold" th:text="${reg.registrationCode}">REG-000001</span>
                <span class="ms-2 badge bg-warning text-dark">PENDING</span>
              </div>
            </div>
            <div class="ms-auto d-flex gap-2">
              <a th:href="@{/students/registrations/{id}(id=${reg.id})}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> <span th:text="#{registration.back.to.details}">詳細へ戻る</span>
              </a>
            </div>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0"><i class="bi bi-pencil-square me-2 text-primary"></i><span th:text="#{registration.edit.pending}">申請内容編集（PENDINGのみ）</span></h5>
            </div>
            <div class="card-body">
              <form th:action="@{/students/registrations/{id}/update(id=${reg.id})}" method="post" th:object="${registration}">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{registration.name.english}">氏名（英語）</label>
                    <input type="text" class="form-control" th:field="*{englishName}" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{registration.name.katakana}">氏名（カタカナ）</label>
                    <input type="text" class="form-control" th:field="*{katakanaName}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold" th:text="#{registration.date.of.birth}">生年月日</label>
                    <input type="date" class="form-control" th:field="*{dob}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold" th:text="#{registration.gender}">性別</label>
                    <input type="text" class="form-control" th:field="*{gender}" th:placeholder="#{placeholder.student.gender}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_6247}">国民ID</label>
                    <input type="text" class="form-control" th:field="*{nationalIdNumber}" required />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_f32c}">電話番号</label>
                    <input type="text" class="form-control" th:field="*{phoneNumber}" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_ecec}">保護者電話番号</label>
                    <input type="text" class="form-control" th:field="*{guardianPhoneNumber}" />
                  </div>

                  <div class="col-12">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_a162}">現在所</label>
                    <textarea class="form-control" rows="3" th:field="*{currentAddress}"></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_b227}">出身地住所</label>
                    <textarea class="form-control" rows="3" th:field="*{hometownAddress}"></textarea>
                  </div>

                  <div class="col-12"><hr class="my-2" /></div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_5e4f}">父の名前</label>
                    <input type="text" class="form-control" th:field="*{fatherName}" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_f5af}">パスポート番号</label>
                    <input type="text" class="form-control" th:field="*{passportNumber}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">JLPT</label>
                    <input type="text" class="form-control" th:field="*{jlptLevel}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_fe09}">希望職種</label>
                    <input type="text" class="form-control" th:field="*{desiredOccupation}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_e025}">その他職種</label>
                    <input type="text" class="form-control" th:field="*{otherOccupation}" />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_e430}">日本渡航経験</label>
                    <select class="form-select" th:field="*{japanTravelExperience}">
                      <option th:value="${null}" th:text="#{students.registration-edit.auto_c5d5}">未選択</option>
                      <option th:value="${true}" th:text="#{students.registration-edit.auto_beb4}">あり</option>
                      <option th:value="${false}" th:text="#{students.registration-edit.auto_3609}">なし</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_3dd2}">COE申請経験</label>
                    <select class="form-select" th:field="*{coeApplicationExperience}">
                      <option th:value="${null}" th:text="#{students.registration-edit.auto_c5d5}">未選択</option>
                      <option th:value="${true}" th:text="#{students.registration-edit.auto_beb4}">あり</option>
                      <option th:value="${false}" th:text="#{students.registration-edit.auto_3609}">なし</option>
                    </select>
                  </div>

                  <div class="col-12"><hr class="my-2" /></div>

                  <div class="col-md-4">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_ad8b}">宗教</label>
                    <input type="text" class="form-control" th:field="*{religion}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_6d7c}">その他宗教</label>
                    <input type="text" class="form-control" th:field="*{otherReligion}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_66d9}">寮希望</label>
                    <select class="form-select" th:field="*{wantDorm}">
                      <option th:value="${null}" th:text="#{students.registration-edit.auto_c5d5}">未選択</option>
                      <option th:value="${true}" th:text="#{students.registration-edit.auto_f44a}">希望する</option>
                      <option th:value="${false}" th:text="#{students.registration-edit.auto_c807}">希望しない</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_9610}">喫煙</label>
                    <select class="form-select" th:field="*{smoking}">
                      <option th:value="${null}" th:text="#{students.registration-edit.auto_c5d5}">未選択</option>
                      <option th:value="${true}" th:text="#{students.registration-edit.auto_beb4}">あり</option>
                      <option th:value="${false}" th:text="#{students.registration-edit.auto_3609}">なし</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_6789}">飲酒</label>
                    <select class="form-select" th:field="*{alcohol}">
                      <option th:value="${null}" th:text="#{students.registration-edit.auto_c5d5}">未選択</option>
                      <option th:value="${true}" th:text="#{students.registration-edit.auto_beb4}">あり</option>
                      <option th:value="${false}" th:text="#{students.registration-edit.auto_3609}">なし</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_1b31}">タトゥー</label>
                    <select class="form-select" th:field="*{tattoo}">
                      <option th:value="${null}" th:text="#{students.registration-edit.auto_c5d5}">未選択</option>
                      <option th:value="${true}" th:text="#{students.registration-edit.auto_beb4}">あり</option>
                      <option th:value="${false}" th:text="#{students.registration-edit.auto_3609}">なし</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_6297}">学費支払予定日</label>
                    <input type="date" class="form-control" th:field="*{tuitionPaymentDate}" />
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold" th:text="#{students.registration-edit.auto_9490}">メモ</label>
                    <textarea class="form-control" rows="4" th:field="*{otherMemo}"></textarea>
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                  <a th:href="@{/students/registrations/{id}(id=${reg.id})}" class="btn btn-outline-secondary" th:text="#{students.registration-edit.auto_6ef3}">キャンセル</a>
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i><th:block th:text="#{students.registration-edit.auto_be5f}">保存</th:block></button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
