<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <head th:replace="~{layouts/admin-layout :: head(pageTitle=${'登録申請編集 | Admin Dashboard'})}"></head>

  <body>
    <div class="dashboard-layout">
      <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage=${'registrations'})}"></th:block>
      <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

      <div class="dashboard-main">
        <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
          <div class="d-flex align-items-center gap-3 mb-3">
            <button class="btn btn-light btn-icon d-lg-none" type="button" aria-label="Toggle sidebar" data-sidebar-toggle>
              <i class="bi bi-list fs-4"></i>
            </button>
            <div>
              <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem">登録申請編集</h1>
              <div class="text-muted mt-1">
                <span class="fw-semibold" th:text="${reg.registrationCode}">REG-000001</span>
                <span class="ms-2 badge bg-warning text-dark">PENDING</span>
              </div>
            </div>
            <div class="ms-auto d-flex gap-2">
              <a th:href="@{/students/registrations/{id}(id=${reg.id})}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> 詳細へ戻る
              </a>
            </div>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0"><i class="bi bi-pencil-square me-2 text-primary"></i>申請内容編集（PENDINGのみ）</h5>
            </div>
            <div class="card-body">
              <form th:action="@{/students/registrations/{id}/update(id=${reg.id})}" method="post" th:object="${registration}">
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">氏名（英語）</label>
                    <input type="text" class="form-control" th:field="*{englishName}" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">氏名（カタカナ）</label>
                    <input type="text" class="form-control" th:field="*{katakanaName}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">生年月日</label>
                    <input type="date" class="form-control" th:field="*{dob}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">性別</label>
                    <input type="text" class="form-control" th:field="*{gender}" placeholder="男性 / 女性" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">国民ID</label>
                    <input type="text" class="form-control" th:field="*{nationalIdNumber}" required />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">電話番号</label>
                    <input type="text" class="form-control" th:field="*{phoneNumber}" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">保護者電話番号</label>
                    <input type="text" class="form-control" th:field="*{guardianPhoneNumber}" />
                  </div>

                  <div class="col-12">
                    <label class="form-label fw-semibold">現在所</label>
                    <textarea class="form-control" rows="3" th:field="*{currentAddress}"></textarea>
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold">出身地住所</label>
                    <textarea class="form-control" rows="3" th:field="*{hometownAddress}"></textarea>
                  </div>

                  <div class="col-12"><hr class="my-2" /></div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">父の名前</label>
                    <input type="text" class="form-control" th:field="*{fatherName}" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">パスポート番号</label>
                    <input type="text" class="form-control" th:field="*{passportNumber}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">JLPT</label>
                    <input type="text" class="form-control" th:field="*{jlptLevel}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">希望職種</label>
                    <input type="text" class="form-control" th:field="*{desiredOccupation}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">その他職種</label>
                    <input type="text" class="form-control" th:field="*{otherOccupation}" />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">日本渡航経験</label>
                    <select class="form-select" th:field="*{japanTravelExperience}">
                      <option th:value="${null}">未選択</option>
                      <option th:value="${true}">あり</option>
                      <option th:value="${false}">なし</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">COE申請経験</label>
                    <select class="form-select" th:field="*{coeApplicationExperience}">
                      <option th:value="${null}">未選択</option>
                      <option th:value="${true}">あり</option>
                      <option th:value="${false}">なし</option>
                    </select>
                  </div>

                  <div class="col-12"><hr class="my-2" /></div>

                  <div class="col-md-4">
                    <label class="form-label fw-semibold">宗教</label>
                    <input type="text" class="form-control" th:field="*{religion}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">その他宗教</label>
                    <input type="text" class="form-control" th:field="*{otherReligion}" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">寮希望</label>
                    <select class="form-select" th:field="*{wantDorm}">
                      <option th:value="${null}">未選択</option>
                      <option th:value="${true}">希望する</option>
                      <option th:value="${false}">希望しない</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">喫煙</label>
                    <select class="form-select" th:field="*{smoking}">
                      <option th:value="${null}">未選択</option>
                      <option th:value="${true}">あり</option>
                      <option th:value="${false}">なし</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">飲酒</label>
                    <select class="form-select" th:field="*{alcohol}">
                      <option th:value="${null}">未選択</option>
                      <option th:value="${true}">あり</option>
                      <option th:value="${false}">なし</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label class="form-label fw-semibold">タトゥー</label>
                    <select class="form-select" th:field="*{tattoo}">
                      <option th:value="${null}">未選択</option>
                      <option th:value="${true}">あり</option>
                      <option th:value="${false}">なし</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label fw-semibold">学費支払予定日</label>
                    <input type="date" class="form-control" th:field="*{tuitionPaymentDate}" />
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold">メモ</label>
                    <textarea class="form-control" rows="4" th:field="*{otherMemo}"></textarea>
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                  <a th:href="@{/students/registrations/{id}(id=${reg.id})}" class="btn btn-outline-secondary">
                    キャンセル
                  </a>
                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save"></i> 保存
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
