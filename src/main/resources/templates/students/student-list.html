<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

  <head th:replace="~{layouts/admin-layout :: head( pageTitle=${'生徒情報一覧 | Admin Dashboard'},
    extraHead=~{::extraCSS}, extraJS=~{::extraJS} )}">
    <style>
      .badge-status {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      }
      .badge-status.enrolled { 
        background: #d1fae5; 
        color: #065f46; 
      }
      .badge-status.graduated { 
        background: #fed7aa; 
        color: #92400e; 
      }
      .badge-status.dropped { 
        background: #fee2e2; 
        color: #991b1b; 
      }
    </style>
  </head>

  <th:block th:fragment="extraCSS">
    <link rel="stylesheet" href="/css/student-list.css" />
  </th:block>

  <th:block th:fragment="extraJS">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script th:inline="javascript">
      // ============ GLOBAL VARIABLES ============
      let allRows = [];
      let currentPage = 1;
      const rowsPerPage = 10;
      const userRole =
        /*[[${#authentication.authorities[0].authority}]]*/ "ROLE_GUEST";

      // ============ DOCUMENT READY ============
      document.addEventListener("DOMContentLoaded", function () {
        initializePage();
        setupEventListeners();
        setupDownloadButton();
        setupPagination();
        setupFilterForm();
      });

      // ============ INITIALIZATION ============
      function initializePage() {
        // Get all rows (excluding header and empty rows)
        allRows = Array.from(
          document.querySelectorAll("#studentTableBody tr")
        ).filter((r) => !r.querySelector("td[colspan]"));

        // Set up select all checkbox
        const selectAll = document.getElementById("selectAll");
        if (selectAll) {
          selectAll.addEventListener("change", handleSelectAll);
        }

        // Display first page
        if (allRows.length > 0) {
          displayPage(1);
        }
        updateSelectionInfo();
      }

      // ============ EVENT LISTENERS ============
      function setupEventListeners() {
        // Listen for checkbox changes
        document.addEventListener("change", function (e) {
          if (e.target.classList.contains("row-checkbox")) {
            updateSelectionInfo();
            updateDownloadButton();
          }
        });
      }

      // ============ SELECT ALL FUNCTIONALITY ============
      function handleSelectAll(e) {
        const allCheckboxes = document.querySelectorAll(".row-checkbox");
        allCheckboxes.forEach((checkbox) => {
          checkbox.checked = e.target.checked;
        });
        updateSelectionInfo();
        updateDownloadButton();
      }

      function updateSelectAllCheckbox() {
        const selectAll = document.getElementById("selectAll");
        if (!selectAll) return;

        const visibleCheckboxes = document.querySelectorAll(
          "#studentTableBody tr:not([style*='display: none']) .row-checkbox"
        );
        const checkedVisible = Array.from(visibleCheckboxes).filter(
          (cb) => cb.checked
        ).length;

        if (checkedVisible === 0) {
          selectAll.checked = false;
          selectAll.indeterminate = false;
        } else if (
          checkedVisible === visibleCheckboxes.length &&
          visibleCheckboxes.length > 0
        ) {
          selectAll.checked = true;
          selectAll.indeterminate = false;
        } else {
          selectAll.checked = false;
          selectAll.indeterminate = true;
        }
      }

      // ============ SELECTION INFO ============
      function updateSelectionInfo() {
        const checkedCount = document.querySelectorAll(
          ".row-checkbox:checked"
        ).length;
        const totalCount = document.querySelectorAll(".row-checkbox").length;

        let infoDiv = document.querySelector(".selection-info");
        if (!infoDiv) {
          infoDiv = document.createElement("div");
          infoDiv.className = "selection-info";
          const filterForm = document.querySelector(
            "#studentFilterForm .d-flex"
          );
          if (filterForm) {
            filterForm.appendChild(infoDiv);
          }
        }

        if (checkedCount > 0) {
          infoDiv.textContent = `${checkedCount}/${totalCount} 名選択中`;
          infoDiv.style.display = "none";
        } else {
          infoDiv.style.display = "none";
        }
      }

      // ============ DATE FORMATTING FOR EXPORT ============
      function formatExportDate(dateStr) {
        if (!dateStr) return "";
        const date = new Date(dateStr);
        if (isNaN(date.getTime())) return dateStr;
        const mm = String(date.getMonth() + 1).padStart(2, "0");
        const dd = String(date.getDate()).padStart(2, "0");
        const yyyy = date.getFullYear();
        return `\u200B${mm}/${dd}/${yyyy}`;
      }

      // ============ DOWNLOAD FUNCTIONALITY ============
      function setupDownloadButton() {
        const downloadBtn = document.getElementById("downloadBtn");
        if (!downloadBtn) return;

        downloadBtn.addEventListener("click", async function () {
          if (userRole !== "ROLE_ADMIN") {
            window.location.href = "/access-denied";
            return;
          }
          await handleDownload();
        });
      }

      async function handleDownload() {
        const downloadBtn = document.getElementById("downloadBtn");
        const originalText = downloadBtn.innerHTML;

        const checkedCheckboxes = document.querySelectorAll(
          ".row-checkbox:checked"
        );

        if (checkedCheckboxes.length === 0) {
          alert("少なくとも1つのチェックボックスをチェックしてください。");
          return;
        }

        try {
          downloadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 処理中...';
          downloadBtn.disabled = true;

          const nameSearch = document.getElementById("nameSearchInput")?.value || "";
          const status = Array.from(document.querySelectorAll(".status-option"))
            .filter((cb) => cb.checked)
            .map((cb) => cb.value)
            .join(",");

          const allCheckboxes = document.querySelectorAll(".row-checkbox");
          const selectedDbIds = Array.from(allCheckboxes)
            .filter((cb) => cb.checked)
            .map((cb) => cb.value)
            .filter((id) => id && id !== "");

          const selectedStudentIds = Array.from(allCheckboxes)
            .filter((cb) => cb.checked)
            .map((cb) => cb.getAttribute("data-student-id"))
            .filter((id) => id);

          const params = new URLSearchParams();
          if (selectedDbIds.length > 0) {
            params.append("ids", selectedDbIds.join(","));
          }
          if (nameSearch) params.append("nameSearch", nameSearch);
          if (status) params.append("status", status);

          const response = await fetch(`/students/export?${params.toString()}`);

          if (!response.ok) {
            throw new Error(`サーバーエラー: ${response.status}`);
          }

          const data = await response.json();

          if (!data || data.length === 0) {
            alert("エクスポートするデータがありません！");
            return;
          }

          const sortedData = sortStudentData(data);
          await exportToExcel(sortedData, selectedStudentIds);
        } catch (err) {
          console.error("Export error:", err);
          alert("エクスポートに失敗しました: " + err.message);
        } finally {
          downloadBtn.innerHTML = originalText;
          downloadBtn.disabled = false;
          updateDownloadButton();
        }
      }

      function sortStudentData(data) {
        const sortedData = [...data];
        sortedData.sort((a, b) => {
          const extractNumber = (studentId) => {
            if (!studentId) return 0;
            const match = studentId.match(/\d+/);
            return match ? parseInt(match[0], 10) : 0;
          };
          const numA = extractNumber(a.studentId);
          const numB = extractNumber(b.studentId);
          if (numA === numB) {
            return (a.studentId || "").localeCompare(b.studentId || "");
          }
          return numA - numB;
        });
        return sortedData;
      }

      async function exportToExcel(data, selectedStudentIds) {
        const headers = [
          "生徒ID", "名前", "名前(カタカナ)", "生年月日", "性別", "父親名",
          "連絡先(TEL,Viber)", "国民ID番号", "パスポート番号", "電話番号",
          "保護者電話番号", "現住所", "出身地住所", "希望職種", "その他希望職種",
          "宗教", "その他宗教", "現在のJLPT合格レベル", "生徒の授業ステータス",
          "在籍状況", "合格済みJLPTレベル", "日本渡航経験", "COE申請経験",
          "寮があれば入りたい", "お酒", "タバコ", "入れ墨", "学校登録日",
          "授業料支払予定日", "授業料支払実績日", "その他メモ（自由形式）"
        ];

        const rows = data.map((student) => [
          student.studentId || "", student.studentName || "", student.nameInJapanese || "",
          formatExportDate(student.dateOfBirth), student.gender || "", student.fatherName || "",
          student.contactViber || "", student.nationalID || "", student.passportNumber || "",
          student.phoneNumber || "", student.secondaryPhone || "", student.currentLivingAddress || "",
          student.homeTownAddress || "", student.desiredJobType || "", student.otherDesiredJobType || "",
          student.religion || "", student.otherReligion || "", student.currentJapanLevel || "",
          student.attendingClassRelatedStatus || "", student.status || "", student.passedHighestJLPTLevel || "",
          student.japanTravelExperience || "", student.coeApplicationExperience || "", student.hostelPreference || "",
          student.isAlcoholDrink === true ? "飲む" : student.isAlcoholDrink === false ? "飲まない" : "",
          student.isSmoking === true ? "吸う" : student.isSmoking === false ? "吸わない" : "",
          student.haveTatto === true ? "ある" : student.haveTatto === false ? "ない" : "",
          formatExportDate(student.enrolledDate), formatExportDate(student.schedulePaymentTutionDate),
          formatExportDate(student.actualTutionPaymentDate), student.memoNotes || ""
        ]);

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
        ws["!cols"] = headers.map((h) => ({ wch: 20 }));
        XLSX.utils.book_append_sheet(wb, ws, "生徒情報");

        const timestamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
        let filename;
        if (selectedStudentIds.length > 0) {
          if (selectedStudentIds.length <= 3) {
            filename = `生徒_${selectedStudentIds.join("_")}_${timestamp}.xlsx`;
          } else {
            filename = `選択生徒_${selectedStudentIds.length}名_${timestamp}.xlsx`;
          }
        } else {
          filename = `全生徒_${timestamp}.xlsx`;
        }
        XLSX.writeFile(wb, filename);
      }

      function updateDownloadButton() {
        const downloadBtn = document.getElementById("downloadBtn");
        if (downloadBtn) {
          downloadBtn.innerHTML = "↓ダウンロード";
        }
      }

      // ============ PAGINATION ============
      function setupPagination() {
        allRows = Array.from(document.querySelectorAll("#studentTableBody tr")).filter(
          r => !r.querySelector("td[colspan]")
        );
        console.log("Total rows found:", allRows.length);
        
        if (allRows.length === 0) {
          const paginationDiv = document.getElementById("pagination");
          if (paginationDiv) paginationDiv.innerHTML = "";
          return;
        }
        displayPage(1);
      }

      function displayPage(page) {
        currentPage = page;
        const start = (page - 1) * rowsPerPage;
        const end = Math.min(start + rowsPerPage, allRows.length);
        
        allRows.forEach(row => {
          row.style.display = "none";
        });
        
        for (let i = start; i < end; i++) {
          if (allRows[i]) {
            allRows[i].style.display = "";
          }
        }
        
        renderPagination();
        updateSelectAllCheckbox();
      }

      function renderPagination() {
        const pageCount = Math.ceil(allRows.length / rowsPerPage);
        const paginationDiv = document.getElementById("pagination");
        if (!paginationDiv) return;
        
        paginationDiv.innerHTML = "";
        
        if (pageCount <= 1) return;
        
        const prevBtn = document.createElement("button");
        prevBtn.innerHTML = "&laquo;";
        prevBtn.className = `btn btn-sm mx-1 ${currentPage === 1 ? 'btn-secondary' : 'btn-outline-primary'}`;
        prevBtn.disabled = currentPage === 1;
        prevBtn.addEventListener("click", () => displayPage(currentPage - 1));
        paginationDiv.appendChild(prevBtn);
        
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(pageCount, currentPage + 2);
        
        for (let i = startPage; i <= endPage; i++) {
          const btn = document.createElement("button");
          btn.textContent = i;
          btn.className = `btn btn-sm mx-1 ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}`;
          btn.addEventListener("click", () => displayPage(i));
          paginationDiv.appendChild(btn);
        }
        
        const nextBtn = document.createElement("button");
        nextBtn.innerHTML = "&raquo;";
        nextBtn.className = `btn btn-sm mx-1 ${currentPage === pageCount ? 'btn-secondary' : 'btn-outline-primary'}`;
        nextBtn.disabled = currentPage === pageCount;
        nextBtn.addEventListener("click", () => displayPage(currentPage + 1));
        paginationDiv.appendChild(nextBtn);
      }

      // ============ FILTER FORM ============
      function setupFilterForm() {
        const statusInput = document.getElementById("statusFilterInput");
        const dropdown = document.getElementById("statusDropdownList");
        const statusCheckboxes = document.querySelectorAll(".status-option");
        const nameInput = document.getElementById("nameSearchInput");
        const form = document.getElementById("studentFilterForm");
        const hiddenStatus = document.getElementById("hiddenStatus");

        const savedStatuses = localStorage.getItem("savedStatuses");
        const savedName = localStorage.getItem("savedName");

        if (savedStatuses && savedStatuses.length > 0) {
          const statusArray = savedStatuses.split(",");
          statusCheckboxes.forEach((cb) => {
            if (statusArray.includes(cb.value)) cb.checked = true;
          });
          if (statusInput) {
            statusInput.value = statusArray.join(", ");
          }
          if (hiddenStatus) {
            hiddenStatus.value = savedStatuses;
          }
        }

        if (savedName && nameInput) {
          nameInput.value = savedName;
        }

        updateStatusInputBg();
        updateNameInputBg();

        statusCheckboxes.forEach((cb) =>
          cb.addEventListener("change", () => {
            const selected = Array.from(statusCheckboxes)
              .filter((c) => c.checked)
              .map((c) => c.value);

            if (statusInput) {
              statusInput.value = selected.length > 0 ? selected.join(", ") : "ステータス選択";
            }
            if (hiddenStatus) {
              hiddenStatus.value = selected.join(",");
            }

            localStorage.setItem("savedStatuses", selected.join(","));
            updateStatusInputBg();
          })
        );

        if (nameInput) {
          nameInput.addEventListener("input", () => {
            localStorage.setItem("savedName", nameInput.value);
            updateNameInputBg();
          });
        }

        if (statusInput) {
          statusInput.addEventListener("click", () => {
            if (dropdown) {
              dropdown.style.display = dropdown.style.display === "block" ? "none" : "block";
            }
          });
        }

        document.addEventListener("click", (e) => {
          if (!e.target.closest(".multiselect-wrapper") && dropdown) {
            dropdown.style.display = "none";
          }
        });

        [statusInput, nameInput].forEach((input) => {
          if (input) {
            input.addEventListener("keydown", (e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                if (form) form.submit();
              }
            });
          }
        });
      }

      function updateStatusInputBg() {
        const statusInput = document.getElementById("statusFilterInput");
        const statusCheckboxes = document.querySelectorAll(".status-option");
        const anyChecked = Array.from(statusCheckboxes).some((cb) => cb.checked);
        if (statusInput) {
          statusInput.style.backgroundColor = anyChecked ? "#E8F0FE" : "white";
        }
      }

      function updateNameInputBg() {
        const nameInput = document.getElementById("nameSearchInput");
        if (nameInput) {
          nameInput.style.backgroundColor = nameInput.value.trim() !== "" ? "#E8F0FE" : "white";
        }
      }

      // Initialize
      document.addEventListener("DOMContentLoaded", function() {
        console.log("Initializing student list page...");
        
        allRows = Array.from(document.querySelectorAll("#studentTableBody tr")).filter(
          r => !r.querySelector("td[colspan]")
        );
        console.log("Total rows after DOM load:", allRows.length);
        
        setupPagination();
        setupEventListeners();
        setupDownloadButton();
        setupFilterForm();
        
        const layout = document.querySelector(".dashboard-layout");
        const toggles = document.querySelectorAll("[data-sidebar-toggle]");
        toggles.forEach((btn) =>
          btn.addEventListener("click", function (event) {
            event.preventDefault();
            layout?.classList.toggle("sidebar-open");
          })
        );
      });
    </script>
  </th:block>

  <body>
    <div class="dashboard-layout">
      <!-- Sidebar -->
      <th:block
        th:replace="~{layouts/admin-layout :: sidebar(currentPage=${'students'})}"
      ></th:block>

      <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

      <!-- Main -->
      <div class="dashboard-main">
        <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
          <div class="page-header mb-3">
            <div class="d-flex align-items-center gap-3">
              <button
                class="btn btn-light btn-icon d-lg-none"
                type="button"
                aria-label="Toggle sidebar"
                data-sidebar-toggle
              >
                <i class="bi bi-list fs-4"></i>
              </button>
              <div>
                <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem" th:text="#{students.student-list.auto_1e0b}">生徒情報一覧画面</h1>
              </div>
              <div class="ms-auto">
                <div class="btn-group" role="group">
                    <a th:href="@{/admin/students/create/step1}" class="btn btn-primary btn-sm" sec:authorize="hasRole('ADMIN')">
                        <i class="bi bi-person-plus-fill"></i><th:block th:text="#{students.student-list.auto_0fd0}">生徒追加</th:block></a>
                    <a th:href="@{/teachers}" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-people-fill"></i><th:block th:text="#{students.student-list.auto_5d7c}">教師管理</th:block></a>
                    <a th:href="@{/courses}" class="btn btn-outline-success btn-sm">
                        <i class="bi bi-book-fill"></i><th:block th:text="#{students.student-list.auto_5b1d}">コース管理</th:block></a>
                    <a th:href="@{/users/add}" class="btn btn-outline-warning btn-sm" sec:authorize="hasRole('ADMIN')">
                        <i class="bi bi-person-plus-fill"></i><th:block th:text="#{students.student-list.auto_4f12}">ユーザー追加</th:block></a>
                </div>
            </div>
            </div>
          </div>

          <div class="table-wrapper p-1" style="border: 1px solid transparent">
            <div class="table-responsive me-3">
              <table class="table data-table align-middle border border-radius"
                id="studentTable">
                <thead>
                  <tr class="filter-row">
                    <th colspan="10" class="p-3">
                      <form th:action="@{/students}" method="get" id="studentFilterForm">
                        <div class="d-flex flex-col md:flex-row align-items-center gap-4 flex-wrap">
                          <div class="filter-control-group checkbox-group flex flex-row justify-content-start">
                            <div>
                              <input type="checkbox" id="selectAll" class="form-check-input"/>
                              <span style="font-size: 16px" th:text="#{students.student-list.auto_5172}">全て選択</span>
                            </div>
                          </div>
                          <div class="filter-control-group">
                            <span style="font-size: 16px" th:text="#{students.student-list.auto_91a0}">名前で検索</span>
                            <input
                              type="text"
                              name="nameSearch"
                              th:value="${nameSearch}"
                              class="form-control form-control-sm"
                              id="nameSearchInput"
                              th:placeholder="#{placeholder.student.search.name}"
                            />
                          </div>
                          <div class="filter-control-group" id="studentStatusWrapper">
                            <div id="studentStatusFilter">
                              <div class="filter-control-group">
                                <label class="filter-label" th:text="#{students.student-list.auto_2c3e}">生徒ステータス</label>
                                <div class="multiselect-wrapper">
                                  <input
                                    type="text"
                                    id="statusFilterInput"
                                    class="multiselect-input"
                                    value="ステータス選択"
                                    readonly
                                  />
                                  <span class="dropdown-arrow">▼</span>
                                  <div id="statusDropdownList"
                                    class="multiselect-dropdown">
                                    <label>
                                      <input type="checkbox" class="status-option" value="在校" th:text="#{students.student-list.auto_ed9f}"/>在校</label>
                                    <label>
                                      <input type="checkbox" class="status-option" value="卒業" th:text="#{students.student-list.auto_bff7}">卒業</label>
                                    <label>
                                      <input type="checkbox" class="status-option" value="途中退校" th:text="#{students.student-list.auto_b541}"/>途中退校</label>
                                  </div>
                                </div>
                              </div>
                            </div>
                          </div>
                          <div class="download-button-container flex flex-row justify-content-start">
                            <button type="button" id="downloadBtn" 
                              sec:authorize="hasRole('GUEST')" disabled style="cursor: not-allowed; opacity: 0.6;" th:text="#{students.student-list.auto_3151}">↓ダウンロード</button>
                            <button type="button" id="downloadBtn" 
                              sec:authorize="hasRole('ADMIN')" th:text="#{students.student-list.auto_3151}">↓ダウンロード</button>
                          </div>
                        </div>
                        <button type="submit" style="display: none"></button>
                        <input type="hidden" name="status" id="hiddenStatus" />
                      </form>
                    </th>
                  </tr>
                  <tr>
                    <th scope="col" style="width: 50px" th:text="#{students.student-list.auto_7ea9}">生徒ID</th>
                    <th scope="col" style="width: 100px" th:text="#{students.student-list.auto_5b9e}">名前</th>
                    <th scope="col" style="width: 80px" th:text="#{students.student-list.auto_4288}">性別</th>
                    <th scope="col" style="width: 100px" th:text="#{students.student-list.auto_f32c}">電話番号</th>
                    <th scope="col" style="width: 100px" th:text="#{students.student-list.auto_fe09}">希望職種</th>
                    <th scope="col" style="width: 80px" th:text="#{students.student-list.auto_54dd}">ステータス</th>
                    <th scope="col" style="width: 100px" th:text="#{students.student-list.auto_9141}">支払予定日</th>
                    <th scope="col" style="width: 100px" th:text="#{students.student-list.auto_74f7}">支払実績日</th>
                    <th scope="col" style="width: 120px" th:text="#{students.student-list.auto_22f0}">動作機能</th>
                  </tr>
                </thead>

                <tbody id="studentTableBody" th:if="${students != null and students.size() > 0}">
                  <tr th:each="student : ${students}">
                    <td data-label="生徒ID" class="id-cell">
                      <label class="d-flex align-items-center justify-content-md-center gap-1 m-0">
                        <input class="form-check-input row-checkbox" type="checkbox" 
                              th:value="${student.id}" th:attr="data-student-id=${student.studentId}"/>
                        <span th:text="${student.studentId}">STU001</span>
                      </label>
                    </td>
                    <td data-label="名前" th:text="${student.studentName}">山田 太郎</td>
                    <td data-label="性別" th:text="${student.gender}">男性</td>
                    <td data-label="電話番号" th:text="${student.phoneNumber}">09012345678</td>
                    <td data-label="希望職種" th:text="${student.desiredJobType ?: '-'}">-</td>
                    <td data-label="ステータス">
                        <span th:if="${student.status == '在校'}" class="badge bg-success">在校</span>
                        <span th:if="${student.status == '卒業'}" class="badge bg-primary">卒業</span>
                        <span th:if="${student.status == '途中退校'}" class="badge bg-danger">途中退校</span>
                        <span th:unless="${student.status == '在校' or student.status == '卒業' or student.status == '途中退校'}" 
                              th:text="${student.status ?: '-'}"></span>
                    </td>
                    <td data-label="支払予定日" th:text="${student.schedulePaymentTutionDate != null ? #temporals.format(student.schedulePaymentTutionDate, 'MM/dd/yyyy') : ''}"></td>
                    <td data-label="支払実績日" th:text="${student.actualTutionPaymentDate != null ? #temporals.format(student.actualTutionPaymentDate, 'MM/dd/yyyy') : ''}"></td>
                    <td data-label="動作機能" class="action-cell">
                      <div class="d-flex flex-nowrap justify-content-center gap-2">
                        <a th:href="@{/students/detail/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}"
                           class="text-decoration-none text-info" 
                           title="詳細"
                           style="font-size: 1.2rem;">
                          <i class="bi bi-info-circle"></i>
                        </a>
                        <a th:href="@{/students/student-update/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}"
                           class="text-decoration-none text-primary" 
                           title="編集"
                           sec:authorize="hasRole('ADMIN') or hasRole('TEACHER')"
                           style="font-size: 1.2rem;">
                          <i class="bi bi-pencil-square"></i>
                        </a>
                        <a th:href="@{'/reports/student/' + ${student.id}}" 
                           class="text-decoration-none text-success" 
                           title="成績"
                           style="font-size: 1.2rem;">
                          <i class="bi bi-bar-chart-fill"></i>
                        </a>
                        <a href="#"
                           th:attr="data-delete-url=@{/students/delete/{id}(id=${student.id}, nameSearch=${nameSearch}, status=${status})}"
                           onclick="if(confirm('本当に削除しますか？')) window.location.href=this.getAttribute('data-delete-url');"
                           class="text-decoration-none text-danger"
                           title="削除"
                           sec:authorize="hasRole('ADMIN')"
                           style="font-size: 1.2rem;">
                          <i class="bi bi-trash-fill"></i>
                        </a>
                      </div>
                    </td>
                  </tr>
                </tbody>

                <tbody th:if="${students == null or students.size() == 0}">
                  <tr>
                    <td colspan="9" class="text-center text-muted py-5">
                      <span th:text="#{students.student-list.auto_0a90}">生徒情報がありません。</span>
                      <span th:if="${students == null}" style="display:block; font-size:12px;">(students is NULL - check controller)</span>
                      <span th:if="${students != null and students.size() == 0}" style="display:block; font-size:12px;">(students is EMPTY - no data in database for your user)</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div id="pagination" class="d-flex justify-content-center mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
