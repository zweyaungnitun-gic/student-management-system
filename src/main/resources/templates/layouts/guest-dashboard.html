<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲストダッシュボード | 生徒情報管理システム</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8fcff;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .guest-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        .welcome-card {
            background: linear-gradient(135deg, #4bb0ff 0%, #6ed6ff 100%);
            border-radius: 1.5rem;
            padding: 2rem;
            color: white;
            margin-bottom: 2rem;
        }
        .info-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
            text-align: center;
            height: 100%;
        }
        .logout-btn {
            background-color: #dc3545;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 2rem;
        }
        .logout-btn:hover {
            background-color: #bb2d3b;
        }
        .footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e9ecef;
            text-align: center;
            color: #6c757d;
        }
    </style>
</head>

<body>
    <div class="guest-container">
        <div class="welcome-card">
            <div class="d-flex justify-content-between align-items-center flex-wrap">
                <div>
                    <h1 class="mb-2">ようこそ、<span th:text="${userName}">ゲスト</span>さん</h1>
                    <p class="mb-0 opacity-75">このシステムは管理者のみが利用できます。</p>
                    <p class="mb-0 opacity-75">ご質問がある場合は管理者にお問い合わせください。</p>
                </div>
                <div class="mt-3 mt-md-0">
                    <img th:src="@{/images/gic-logo.png}" alt="GIC Logo" style="height: 70px; background: white; padding: 10px; border-radius: 1rem;">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="info-card">
                    <i class="bi bi-info-circle-fill fs-1 text-primary mb-3"></i>
                    <h5>アクセス制限</h5>
                    <p class="text-muted">ゲストアカウントでは、生徒情報やテスト結果などの閲覧・編集はできません。</p>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="info-card">
                    <i class="bi bi-person-badge fs-1 text-success mb-3"></i>
                    <h5>お問い合わせ</h5>
                    <p class="text-muted">システムに関するお問い合わせは管理者までご連絡ください。</p>
                    <small class="text-muted">admin@gmail.com</small>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="info-card">
                    <i class="bi bi-box-arrow-right fs-1 text-danger mb-3"></i>
                    <h5>ログアウト</h5>
                    <p class="text-muted">セッションを終了する場合は、下のボタンからログアウトしてください。</p>
                </div>
            </div>
        </div>

        <div class="text-center mt-2">
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger logout-btn">
                    <i class="bi bi-box-arrow-right me-2"></i>ログアウト
                </button>
            </form>
        </div>

        <div class="footer">
            <p class="mb-0">&copy; 2025 Global Innovation Consulting Inc. All Rights Reserved.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
