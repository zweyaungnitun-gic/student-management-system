<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">

<head th:fragment="head(pageTitle)">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${pageTitle} ?: 'GIC Online Test | Admin Dashboard'">GIC Online Test | Admin Dashboard</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  <style>
    .transition-icon {
      transition: transform 0.3s ease;
    }

    [aria-expanded="true"] .transition-icon {
      transform: rotate(180deg);
    }

    .sidebar-nav .collapse {
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      margin-left: 1.25rem;
    }
    /* Minimal pill style */
    .lang-pill {
        padding: 4px 8px;
        font-size: 0.7rem;
        text-decoration: none;
        border-radius: 4px;
        transition: all 0.2s ease;
        color: rgba(255, 255, 255, 0.7);
        display: inline-flex;
        align-items: center;
    }

    .lang-pill i {
        font-size: 0.7rem;
    }

    .lang-pill.active {
        color: #0d6efd;
        font-weight: 600;
    }

    .lang-pill:hover:not(.active) {
        color: white;
    }
  </style>
</head>

<body>
  <!-- Sidebar fragment -->
  <th:block th:fragment="sidebar(currentPage)">
      <aside class="dashboard-sidebar glass-panel">
          <div class="sidebar-brand gap-3">
              <div class="brand-badge bg-white shadow-sm">
                  <img th:src="@{/images/image.png}" alt="GIC logo" />
              </div>
              <div class="flex-grow-1">
                  <p class="text-uppercase text-muted small fw-semibold mb-0" th:text="#{app.title}">生徒情報管理システム</p>
              </div>
          </div>

          <div class="sidebar-user">
            <div class="d-flex align-items-center gap-3">
                <img class="user-avatar" th:src="@{/images/profile.jpg}" alt="Admin avatar" />
                <div>
                    <p class="mb-0 fw-semibold" th:text="${userName} ?: 'Admin'">Admin</p>
                    <p class="mb-0 small text-muted" th:text="${userRole} ?: 'Role'">Role</p>
                </div>
              </div>
          </div>
       
        <!-- Language Selector -->
        <div class="language-selector-sidebar mt-2 mb-2">
            <div class="d-flex gap-1 justify-content-center">
                <a href="?lang=en" class="lang-pill" th:classappend="${#locale.language == 'en'} ? 'active' : ''">
                    <i class="bi bi-globe2 me-1"></i>EN
                </a>
                <span class="text-muted">|</span>
                <a href="?lang=ja" class="lang-pill" th:classappend="${#locale.language == 'ja'} ? 'active' : ''">
                    <i class="bi bi-globe2 me-1"></i>JP
                </a>
            </div>
        </div>

      <nav class="sidebar-nav mt-3">
        <a class="sidebar-link" th:classappend="${currentPage == 'dashboard' ? ' active' : ''}" th:href="@{/dashboard}">
          <i class="bi bi-speedometer2"></i>
          <span th:text="#{nav.dashboard}">ダッシュボード</span>
          <span class="badge rounded-pill bg-primary ms-auto" style="font-size: 0.7rem;"
            th:if="${currentPage} == 'dashboard'">New</span>
        </a>

        <a class="sidebar-link" th:classappend="${currentPage == 'registrations' ? ' active' : ''}"
          th:href="@{/students/registrations}">
          <i class="bi bi-inbox"></i>
          <span th:text="#{nav.registrations}">登録申請</span>
          <span class="badge rounded-pill bg-primary ms-auto" style="font-size: 0.7rem;"
            th:if="${currentPage} == 'registrations'">New</span>
        </a>

        <div class="sidebar-label mt-3" th:text="#{layouts.admin-layout.auto_08b5}">管理</div>

        <div class="nav-item">
          <a class="sidebar-link d-flex align-items-center" data-bs-toggle="collapse" href="#managementCollapse"
            role="button"
            th:aria-expanded="${currentPage == 'students' or currentPage == 'teachers' or currentPage == 'courses' ? 'true' : 'false'}"
            onclick="return false;">
            <i class="bi bi-hdd-stack"></i>
            <span th:text="#{nav.master.management}">マスタ管理</span>
            <i class="bi bi-chevron-down ms-auto small transition-icon"></i>
          </a>
          <div class="collapse" id="managementCollapse"
            th:classappend="${currentPage == 'students' or currentPage == 'teachers' or currentPage == 'courses' ? ' show' : ''}">
            <nav class="sidebar-nav ps-3">
              <a class="sidebar-link" th:classappend="${currentPage == 'students' ? ' active' : ''}"
                th:href="@{/students}">
                <i class="bi bi-people"></i> <span th:text="#{nav.student.management}">生徒管理</span>
                <span class="badge rounded-pill bg-primary ms-auto" style="font-size: 0.7rem;"
                  th:if="${currentPage} == 'students'">New</span>
              </a>
              <a class="sidebar-link" th:classappend="${currentPage == 'registrations' ? ' active' : ''}"
                th:href="@{/students/registrations(registrationStatus='PENDING')}">
                <i class="bi bi-inbox"></i> <span th:text="#{nav.registrations}">登録申請管理</span>
                <span class="badge rounded-pill bg-danger ms-auto" style="font-size: 0.7rem;"
                  th:if="${currentPage} == 'registrations' and ${pendingRegistrations != null} and ${pendingRegistrations > 0}"
                  th:text="${pendingRegistrations}"></span>
              </a>
              <a class="sidebar-link" th:classappend="${currentPage == 'teachers' ? ' active' : ''}"
                th:href="@{/teachers}">
                <i class="bi bi-person-workspace"></i> <span th:text="#{nav.teacher.management}">教師管理</span>
                <span class="badge rounded-pill bg-primary ms-auto" style="font-size: 0.7rem;"
                  th:if="${currentPage} == 'teachers'">New</span>
              </a>
              <a class="sidebar-link" th:classappend="${currentPage == 'courses' ? ' active' : ''}"
                th:href="@{/courses}">
                <i class="bi bi-book"></i> <span th:text="#{nav.course.management}">コース管理</span>
                <span class="badge rounded-pill bg-primary ms-auto" style="font-size: 0.7rem;"
                  th:if="${currentPage} == 'courses'">New</span>
              </a>
            </nav>
          </div>
        </div>

        <div class="nav-item">
          <a class="sidebar-link d-flex align-items-center" data-bs-toggle="collapse" href="#academicCollapse"
            role="button"
            th:aria-expanded="${currentPage == 'tests' or currentPage == 'results' or currentPage == 'rankings' ? 'true' : 'false'}"
            onclick="return false;">
            <i class="bi bi-mortarboard"></i>
            <span th:text="#{nav.academic.management}">教務管理</span>
            <i class="bi bi-chevron-down ms-auto small transition-icon"></i>
          </a>
          <div class="collapse" id="academicCollapse"
            th:classappend="${currentPage == 'tests' or currentPage == 'results' or currentPage == 'rankings' ? ' show' : ''}">
            <nav class="sidebar-nav ps-3">
              <a class="sidebar-link" th:classappend="${currentPage == 'tests' ? ' active' : ''}" th:href="@{/tests}">
                <i class="bi bi-file-text"></i> <span th:text="#{nav.test.management}">テスト管理</span>
                <span class="badge rounded-pill bg-primary ms-auto" style="font-size: 0.7rem;"
                  th:if="${currentPage} == 'tests'">New</span>
              </a>
              <a class="sidebar-link" th:classappend="${currentPage == 'results' ? ' active' : ''}"
                th:href="@{/results}">
                <i class="bi bi-bar-chart"></i> <span th:text="#{nav.test.results}">テスト結果</span>
                <span class="badge rounded-pill bg-primary ms-auto" style="font-size: 0.7rem;"
                  th:if="${currentPage} == 'results'">New</span>
              </a>
              <a class="sidebar-link" th:classappend="${currentPage == 'rankings' ? ' active' : ''}"
                th:href="@{/reports/rankings?className=N5}">
                <i class="bi bi-trophy"></i> <span th:text="#{nav.class.rankings}">クラス順位</span>
                <span class="badge rounded-pill bg-primary ms-auto" style="font-size: 0.7rem;"
                  th:if="${currentPage} == 'reports/rankings?className=N5'">New</span>
              </a>
            </nav>
          </div>
        </div>

      <div class="sidebar-label mt-3" th:text="#{sidebar.system}">システム</div>
        <a class="sidebar-link" th:classappend="${currentPage == 'users' ? ' active' : ''}" th:href="@{/users}"
          sec:authorize="hasRole('ADMIN')">
          <i class="bi bi-person-badge"></i>
          <span th:text="#{nav.user.management}">ユーザー管理</span>
          <span class="badge rounded-pill bg-primary ms-auto" style="font-size: 0.7rem;"
            th:if="${currentPage} == 'users'">New</span>
        </a>

        <a class="sidebar-link text-danger fw-semibold mt-auto" th:href="@{/logout}">
          <i class="bi bi-box-arrow-right"></i>
          <span th:text="#{nav.logout}">ログアウト</span>
        </a>
      </nav>
    </aside>

  </th:block>

  <!-- Topbar fragment-->
  <th:block th:fragment="topbar(pageTitle, pageSubtitle, showAddButton)">
    <header class="dashboard-topbar d-flex justify-content-between align-items-center px-3 py-2">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light btn-icon d-lg-none" type="button" data-sidebar-toggle aria-label="Toggle sidebar">
          <i class="bi bi-list fs-4"></i>
        </button>
        <div>
          <p class="text-uppercase text-muted small fw-semibold mb-1"
            th:text="${pageSubtitle != null ? pageSubtitle : 'Welcome back'}">
            Welcome back
          </p>
          <h4 class="mb-0" th:text="${pageTitle} != null ? pageTitle : 'Admin Dashboard'">Admin Dashboard</h4>
        </div>
      </div>

      <div class="topbar-actions d-flex align-items-center gap-2">
        <div class="topbar-search d-none d-md-flex align-items-center">
          <i class="bi bi-search"></i>
          <input type="search" class="form-control border-0 bg-transparent shadow-none p-0"
            th:placeholder="#{placeholder.search.general}" />
        </div>

        <!-- Language Selector Dropdown -->
        <div class="dropdown">
          <button class="btn btn-outline-secondary btn-sm dropdown-toggle d-flex align-items-center gap-1" type="button"
            id="topbarLanguageDropdown" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-globe"></i>
            <span th:text="#{app.language}">Language</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="topbarLanguageDropdown">
            <li>
              <a class="dropdown-item" href="?lang=en" th:classappend="${#locale.language == 'en'} ? 'active' : ''">
                🇺🇸 English
              </a>
            </li>
            <li>
              <a class="dropdown-item" href="?lang=ja" th:classappend="${#locale.language == 'ja'} ? 'active' : ''"
                th:text="#{layouts.admin-layout.auto_fd32}">🇯🇵 日本語</a>
            </li>
          </ul>
        </div>

        <button class="btn btn-primary d-flex align-items-center gap-2" th:if="${showAddButton}"
          th:attr="data-bs-toggle='modal', data-bs-target=${addButtonTarget}">
          <i class="bi bi-plus-lg"></i>
          <span th:text="${addButtonLabel} != null ? addButtonLabel : 'Add'">Add</span>
        </button>
      </div>
    </header>
  </th:block>

  <!-- Footer fragment -->
  <th:block th:fragment="footer">
    <footer class="text-center py-3 small text-muted">
      © <span th:text="${T(java.time.Year).now().value}">2025</span>
      <th:block th:text="#{layouts.admin-layout.auto_6152}">生徒情報管理システム</th:block>
    </footer>
  </th:block>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Sidebar toggle for mobile
      const layout = document.querySelector(".dashboard-layout");
      const toggles = document.querySelectorAll("[data-sidebar-toggle]");
      toggles.forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          layout?.classList.toggle("sidebar-open");
        });
      });
    });
  </script>

  <th:block th:if="${pageJs != null}" th:replace="${pageJs}"></th:block>

</body>

</html>
