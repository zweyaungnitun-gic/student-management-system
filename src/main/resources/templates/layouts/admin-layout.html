<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(pageTitle)">
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${pageTitle} ?: 'GIC Online Test | Admin Dashboard'">GIC Online Test | Admin Dashboard</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
</head>

<body>
  <!-- Sidebar fragment -->
  <th:block th:fragment="sidebar(currentPage)">
    <aside class="dashboard-sidebar glass-panel">
      <div class="sidebar-brand gap-3">
        <div class="brand-badge bg-white shadow-sm">
          <img th:src="@{/images/gic-logo.png}" alt="GIC logo"/>
        </div>
        <div class="flex-grow-1">
          <p class="text-uppercase text-muted small fw-semibold mb-0 text-nowrap">生徒情報管理システム</p>
          <!-- <h5 class="mb-0">生徒情報管理システム</h5> -->
        </div>
      </div>

      <div class="sidebar-user">
        <div class="d-flex align-items-center gap-3">
          <img class="user-avatar" th:src="@{/images/profile.png}" alt="Admin avatar"/>
          <div>
            <p class="mb-0 fw-semibold" th:text="${userName} ?: 'Admin'">Admin</p>
            <p class="mb-0 small text-muted" th:text="${userRole} ?: 'Role'">Role</p>
          </div>
        </div>
        <div class="badge badge-muted fw-medium mt-3 w-100 text-center">Verified Account</div>
      </div>

      <nav class="sidebar-nav mt-3">
          <a class="sidebar-link" th:classappend="${currentPage} == 'dashboard' ? ' active' : ''" th:href="@{/dashboard}">
              <i class="bi bi-speedometer2"></i>
              <span>ダッシュボード</span>
              <span class="sidebar-pill" th:if="${currentPage} == 'dashboard'">Now</span>
          </a>
          
          <a class="sidebar-link" th:classappend="${currentPage} == 'students' ? ' active' : ''" th:href="@{/students}">
              <i class="bi bi-people"></i>
              <span>生徒管理</span>
              <span class="sidebar-pill" th:if="${currentPage} == 'students'">Now</span>
          </a>
          
          <a class="sidebar-link" th:classappend="${currentPage} == 'teachers' ? ' active' : ''" th:href="@{/teachers}">
              <i class="bi bi-person-workspace"></i>
              <span>教師管理</span>
              <span class="sidebar-pill" th:if="${currentPage} == 'teachers'">Now</span>
          </a>
          
          <a class="sidebar-link" th:classappend="${currentPage} == 'courses' ? ' active' : ''" th:href="@{/courses}">
              <i class="bi bi-book"></i>
              <span>コース管理</span>
              <span class="sidebar-pill" th:if="${currentPage} == 'courses'">Now</span>
          </a>
          
          <a class="sidebar-link" th:classappend="${currentPage} == 'tests' ? ' active' : ''" th:href="@{/tests}">
              <i class="bi bi-file-text"></i>
              <span>テスト管理</span>
              <span class="sidebar-pill" th:if="${currentPage} == 'tests'">Now</span>
          </a>
          
          <a class="sidebar-link" th:classappend="${currentPage} == 'results' ? ' active' : ''" th:href="@{/results}">
              <i class="bi bi-bar-chart"></i>
              <span>テスト結果</span>
              <span class="sidebar-pill" th:if="${currentPage} == 'results'">Now</span>
          </a>

          <div class="sidebar-label mt-3">レポート</div>
          <nav class="sidebar-nav">
              <a class="sidebar-link" th:classappend="${currentPage} == 'rankings' ? ' active' : ''" th:href="@{/reports/rankings?className=N5}">
                  <i class="bi bi-trophy"></i>
                  <span>クラス順位</span>
                  <span class="sidebar-pill" th:if="${currentPage} == 'rankings'">New</span>
              </a>
              <a class="sidebar-link" th:href="@{/reports/dashboard}">
                  <i class="bi bi-pie-chart"></i>
                  <span>レポートダッシュボード</span>
              </a>
          </nav>

          <a class="sidebar-link" th:classappend="${currentPage} == 'users' ? ' active' : ''" th:href="@{/users}" sec:authorize="hasRole('ADMIN')">
              <i class="bi bi-person-badge"></i>
              <span>ユーザー管理</span>
              <span class="sidebar-pill" th:if="${currentPage} == 'users'">Now</span>
          </a>
          
          <div class="sidebar-label mt-3">システム</div>
          
          <a class="sidebar-link" th:href="@{/logout}">
              <i class="bi bi-box-arrow-right"></i>
              <span>ログアウト</span>
          </a>
      </nav>
    </aside>
  </th:block>

  <!-- Topbar fragment-->
  <th:block th:fragment="topbar(pageTitle, pageSubtitle, showAddButton)">
    <header class="dashboard-topbar d-flex justify-content-between align-items-center px-3 py-2">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light btn-icon d-lg-none" type="button" data-sidebar-toggle aria-label="Toggle sidebar">
          <i class="bi bi-list fs-4"></i>
        </button>
        <div>
          <p class="text-uppercase text-muted small fw-semibold mb-1" 
            th:text="${pageSubtitle != null ? pageSubtitle : 'Welcome back'}">
            Welcome back
          </p>
          <h4 class="mb-0" th:text="${pageTitle} != null ? pageTitle : 'Admin Dashboard'">Admin Dashboard</h4>
        </div>
      </div>

      <div class="topbar-actions d-flex align-items-center gap-2">
        <div class="topbar-search d-none d-md-flex align-items-center">
          <i class="bi bi-search"></i>
          <input type="search" class="form-control border-0 bg-transparent shadow-none p-0" placeholder="Search..."/>
        </div>

        <button class="btn btn-primary d-flex align-items-center gap-2"
                th:if="${showAddButton}"
                th:attr="data-bs-toggle='modal', data-bs-target=${addButtonTarget}">
          <i class="bi bi-plus-lg"></i>
          <span th:text="${addButtonLabel} != null ? addButtonLabel : 'Add'">Add</span>
        </button>
      </div>
    </header>
  </th:block>

  <!-- Footer fragment -->
  <th:block th:fragment="footer">
    <footer class="text-center py-3 small text-muted">
      © <span th:text="${T(java.time.Year).now().value}">2025</span> 生徒情報管理システム
    </footer>
  </th:block>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
      const layout = document.querySelector(".dashboard-layout");
      const toggles = document.querySelectorAll("[data-sidebar-toggle]");
      toggles.forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          layout?.classList.toggle("sidebar-open");
        });
      });
    });
  </script>

  <th:block th:if="${pageJs != null}" th:replace="${pageJs}"></th:block>

</body>
</html>
