<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layouts/admin-layout :: head(pageTitle='ダッシュボード | 生徒情報管理システム')}">
</head>

<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage='dashboard')}"></th:block>

        <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

        <div class="dashboard-main">
            <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
                <!-- Page Header -->
                <div class="page-header mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light btn-icon d-lg-none" type="button" aria-label="Toggle sidebar"
                            data-sidebar-toggle>
                            <i class="bi bi-list fs-4"></i>
                        </button>
                        <div>
                            <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem;">
                                生徒情報管理システム
                            </h1>
                            <!-- <p class="text-muted mb-0">ようこそ、<span th:text="${userName}">管理者</span>さん</p> -->
                        </div>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="flex-shrink-0 bg-primary bg-opacity-10 p-3 rounded">
                                        <i class="bi bi-people-fill fs-2 text-primary"></i>
                                    </div>
                                    <div class="flex-grow-1 ms-3">
                                        <h6 class="text-muted mb-1">総生徒数</h6>
                                        <h3 class="mb-0 fw-bold" th:text="${totalStudents}">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="flex-shrink-0 bg-success bg-opacity-10 p-3 rounded">
                                        <i class="bi bi-person-workspace fs-2 text-success"></i>
                                    </div>
                                    <div class="flex-grow-1 ms-3">
                                        <h6 class="text-muted mb-1">総教師数</h6>
                                        <h3 class="mb-0 fw-bold" th:text="${totalTeachers}">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="flex-shrink-0 bg-info bg-opacity-10 p-3 rounded">
                                        <i class="bi bi-book-fill fs-2 text-info"></i>
                                    </div>
                                    <div class="flex-grow-1 ms-3">
                                        <h6 class="text-muted mb-1">総コース数</h6>
                                        <h3 class="mb-0 fw-bold" th:text="${totalCourses}">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="flex-shrink-0 bg-warning bg-opacity-10 p-3 rounded">
                                        <i class="bi bi-person-badge-fill fs-2 text-warning"></i>
                                    </div>
                                    <div class="flex-grow-1 ms-3">
                                        <h6 class="text-muted mb-1">総ユーザー数</h6>
                                        <h3 class="mb-0 fw-bold" th:text="${totalUsers}">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Students and Active Courses -->
                <div class="row g-4">
                    <!-- Recent Students -->
                    <div class="col-lg-6">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-white py-3">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-clock-history me-2 text-primary"></i>
                                    最近登録された生徒
                                </h5>
                            </div>
                            <div class="card-body p-0">
                                <div class="list-group list-group-flush">
                                    <div th:each="student : ${recentStudents}" 
                                         class="list-group-item d-flex justify-content-between align-items-center">
                                        <div>
                                            <h6 class="mb-1" th:text="${student.studentName}">山田 太郎</h6>
                                            <small class="text-muted" th:text="${student.studentId}">STU001</small>
                                        </div>
                                        <span class="badge bg-primary rounded-pill" th:text="${student.status}">在校</span>
                                    </div>
                                    <div th:if="${recentStudents.isEmpty()}" class="list-group-item text-center text-muted py-4">
                                        最近登録された生徒はいません
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer bg-white text-end">
                                <a href="/students" class="btn btn-sm btn-outline-primary">
                                    すべての生徒を見る <i class="bi bi-arrow-right ms-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Active Courses -->
                    <div class="col-lg-6">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-white py-3">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-bookmark-star me-2 text-success"></i>
                                    アクティブなコース
                                </h5>
                            </div>
                            <div class="card-body p-0">
                                <div class="list-group list-group-flush">
                                    <div th:each="course : ${activeCourses}" 
                                         class="list-group-item d-flex justify-content-between align-items-center">
                                        <div>
                                            <h6 class="mb-1" th:text="${course.courseName}">Java Programming</h6>
                                            <small class="text-muted" th:text="${course.courseCode}">JAVA101</small>
                                        </div>
                                        <span class="badge bg-success rounded-pill">
                                            <span th:text="${course.creditHours}">3</span> 単位
                                        </span>
                                    </div>
                                    <div th:if="${activeCourses.isEmpty()}" class="list-group-item text-center text-muted py-4">
                                        アクティブなコースはありません
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer bg-white text-end">
                                <a href="/courses" class="btn btn-sm btn-outline-success">
                                    すべてのコースを見る <i class="bi bi-arrow-right ms-1"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Quick Actions -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-white py-3">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-lightning-charge-fill me-2 text-warning"></i>
                                    クイックアクション
                                </h5>
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-3 col-6">
                                        <a href="/register" class="text-decoration-none">
                                            <div class="text-center p-3 border rounded bg-light">
                                                <i class="bi bi-person-plus-fill fs-2 text-primary mb-2"></i>
                                                <h6 class="mb-0">新規生徒登録</h6>
                                            </div>
                                        </a>
                                    </div>
                                    <div class="col-md-3 col-6">
                                        <a href="/teachers/add" class="text-decoration-none">
                                            <div class="text-center p-3 border rounded bg-light">
                                                <i class="bi bi-person-plus-fill fs-2 text-success mb-2"></i>
                                                <h6 class="mb-0">新規教師追加</h6>
                                            </div>
                                        </a>
                                    </div>
                                    <div class="col-md-3 col-6">
                                        <a href="/courses/add" class="text-decoration-none">
                                            <div class="text-center p-3 border rounded bg-light">
                                                <i class="bi bi-journal-plus fs-2 text-info mb-2"></i>
                                                <h6 class="mb-0">新規コース追加</h6>
                                            </div>
                                        </a>
                                    </div>
                                    <div class="col-md-3 col-6">
                                        <a href="/users/add" class="text-decoration-none">
                                            <div class="text-center p-3 border rounded bg-light">
                                                <i class="bi bi-person-badge-fill fs-2 text-warning mb-2"></i>
                                                <h6 class="mb-0">新規ユーザー追加</h6>
                                            </div>
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const layout = document.querySelector(".dashboard-layout");
            const toggles = document.querySelectorAll("[data-sidebar-toggle]");
            toggles.forEach((btn) =>
                btn.addEventListener("click", function (event) {
                    event.preventDefault();
                    layout?.classList.toggle("sidebar-open");
                })
            );
        });
    </script>
</body>
</html>
