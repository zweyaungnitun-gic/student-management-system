<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layouts/admin-layout :: head(pageTitle='ユーザー管理 | 生徒情報管理システム')}">
</head>

<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage='users')}"></th:block>

        <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

        <div class="dashboard-main">
            <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
                <!-- Page Header with toggle button -->
                <div class="page-header mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light btn-icon d-lg-none" type="button" aria-label="Toggle sidebar"
                            data-sidebar-toggle>
                            <i class="bi bi-list fs-4"></i>
                        </button>
                        <div>
                            <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem;">
                                ユーザー一覧
                            </h1>
                        </div>
                    </div>
                </div>

                <!-- Success/Error Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" style="margin: 1rem 0;">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" style="margin: 1rem 0;">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Users Table -->
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                          <!-- Search and Add User Section-->
                          <div class="p-3 border-bottom">
                              <div class="d-flex justify-content-between align-items-center">
                                  <form th:action="@{/users}" method="get" class="d-flex gap-2">
                                      <div class="input-group" style="max-width: 400px;">
                                          <span class="input-group-text bg-white border-end-0">
                                              <i class="bi bi-search text-muted"></i>
                                          </span>
                                          <input type="text" class="form-control border-start-0" name="search" 
                                                th:value="${search}" placeholder="名前またはメールで検索...">
                                      </div>
                                      <button type="submit" class="btn btn-primary px-3 py-2 d-flex align-items-center gap-2" 
                                              style="white-space: nowrap;">
                                          <i class="bi bi-search"></i>
                                          <span>検索</span>
                                      </button>
                                      <a href="/users" class="btn btn-outline-secondary px-3 py-2 d-flex align-items-center gap-2" 
                                        style="white-space: nowrap;">
                                          <i class="bi bi-arrow-repeat"></i>
                                          <span>リフレッシュ</span>
                                      </a>
                                  </form>
                                  
                                  <!-- User Add Button - Right end -->
                                  <div>
                                      <a href="/users/add" class="btn btn-success px-3 py-2 d-flex align-items-center gap-2" 
                                        sec:authorize="hasRole('ADMIN')" style="white-space: nowrap;">
                                          <i class="bi bi-person-plus-fill"></i>
                                          <span>ユーザー追加</span>
                                      </a>
                                  </div>
                              </div>
                          </div>

                            <!-- Users Table -->
                            <table class="table table-hover align-middle mb-0" id="userTable">
                                <thead class="bg-primary text-white">
                                    <tr>
                                        <th class="text-center">ID</th>
                                        <th class="text-center">ユーザーID</th>
                                        <th class="text-center">名前</th>
                                        <th class="text-center">メール</th>
                                        <th class="text-center">ロール</th>
                                        <th class="text-center">作成日</th>
                                        <th class="text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="userTableBody">
                                    <tr th:each="user : ${users}">
                                        <td class="text-center" th:text="${user.id}"></td>
                                        <td class="text-center">
                                            <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill"
                                                  th:text="${user.userId}"></span>
                                        </td>
                                        <td th:text="${user.username}"></td>
                                        <td th:text="${user.email}"></td>
                                        <td class="text-center">
                                            <span th:if="${user.role.name() == 'ADMIN'}" 
                                                  class="badge bg-danger bg-opacity-10 text-danger px-3 py-2 rounded-pill">管理者</span>
                                            <span th:if="${user.role.name() == 'GUEST'}" 
                                                  class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill">ゲスト</span>
                                        </td>
                                        <td class="text-center" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                                        <td class="text-center">
                                            <div class="d-flex gap-3 justify-content-center">
                                                <a th:href="@{'/users/edit/' + ${user.id}}" 
                                                   class="text-decoration-none text-primary" 
                                                   title="編集"
                                                   style="font-size: 1.2rem;">
                                                    <i class="bi bi-pencil-square"></i>
                                                </a>
                                                <a th:href="@{'/users/delete/' + ${user.id}}" 
                                                   class="text-decoration-none text-danger" 
                                                   title="削除"
                                                   onclick="return confirm('このユーザーを削除してもよろしいですか？');"
                                                   style="font-size: 1.2rem;">
                                                    <i class="bi bi-trash-fill"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${users.size() == 0}">
                                        <td colspan="7" class="text-center text-muted py-5">
                                            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                                            ユーザーが登録されていません。
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div id="pagination" class="d-flex justify-content-center mt-4"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Pagination Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Sidebar toggle
            const layout = document.querySelector(".dashboard-layout");
            const toggles = document.querySelectorAll("[data-sidebar-toggle]");
            toggles.forEach((btn) =>
                btn.addEventListener("click", function (event) {
                    event.preventDefault();
                    layout?.classList.toggle("sidebar-open");
                })
            );

            // Pagination
            const rows = Array.from(document.querySelectorAll("#userTableBody tr")).filter(
                r => !r.querySelector("td[colspan]")
            );
            
            if (rows.length === 0) return;
            
            const rowsPerPage = 10;
            let currentPage = 1;
            
            function displayPage(page) {
                currentPage = page;
                const start = (page - 1) * rowsPerPage;
                const end = start + rowsPerPage;
                
                rows.forEach((row, index) => {
                    row.style.display = index >= start && index < end ? "" : "none";
                });
                
                renderPagination();
            }
            
            function renderPagination() {
                const pageCount = Math.ceil(rows.length / rowsPerPage);
                const paginationDiv = document.getElementById("pagination");
                
                paginationDiv.innerHTML = "";
                
                // Previous button
                const prevBtn = document.createElement("button");
                prevBtn.innerHTML = "&laquo;";
                prevBtn.className = `btn btn-sm mx-1 ${currentPage === 1 ? 'btn-secondary' : 'btn-outline-primary'}`;
                prevBtn.disabled = currentPage === 1;
                prevBtn.addEventListener("click", () => displayPage(currentPage - 1));
                paginationDiv.appendChild(prevBtn);
                
                // Page numbers
                let startPage = Math.max(1, currentPage - 2);
                let endPage = Math.min(pageCount, currentPage + 2);
                
                for (let i = startPage; i <= endPage; i++) {
                    const btn = document.createElement("button");
                    btn.textContent = i;
                    btn.className = `btn btn-sm mx-1 ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}`;
                    btn.addEventListener("click", () => displayPage(i));
                    paginationDiv.appendChild(btn);
                }
                
                // Next button
                const nextBtn = document.createElement("button");
                nextBtn.innerHTML = "&raquo;";
                nextBtn.className = `btn btn-sm mx-1 ${currentPage === pageCount ? 'btn-secondary' : 'btn-outline-primary'}`;
                nextBtn.disabled = currentPage === pageCount;
                nextBtn.addEventListener("click", () => displayPage(currentPage + 1));
                paginationDiv.appendChild(nextBtn);
            }
            
            displayPage(1);
        });
    </script>
</body>
</html>
