<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Management System | Admin Detail</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
  <link rel="stylesheet" th:href="@{/css/users-list.css}" />
</head>

<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage='users')}"></th:block>

    <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

    <div class="dashboard-main" style="background-color: #f8fcff !important;">
      <div class="page-wrapper" style="padding: 0; height: 100%; margin: 0; width: 100%;">
        <div class="users-list-container" style="height: 100%; width: 100%; margin: 0; padding: 0; max-width: none;">
          <div class="users-card" style="height: 100%; width: 100%; border-radius: 0; display: flex; flex-direction: column; margin: 0; max-width: none; background-color: #f8fcff !important;">
            
            <!-- Success/Error Messages -->
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" style="margin: 1rem; margin-bottom: 0;">
              <i class="bi bi-check-circle-fill me-2"></i>
              <span th:text="${success}"></span>
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" style="margin: 1rem; margin-bottom: 0;">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              <span th:text="${error}"></span>
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            
            <!-- Header -->
            <div class="users-header d-flex justify-content-between align-items-center" style="padding: 1.5rem 2rem;">
              <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light btn-icon d-lg-none" type="button" aria-label="Toggle sidebar"
                  data-sidebar-toggle>
                  <i class="bi bi-list fs-4"></i>
                </button>
                <div>
                  <h4 class="mb-0" style="color: #0A58A0; font-weight: 600; font-size: 1.8rem;">
                    <i class="bi bi-person-badge me-2"></i>管理者詳細情報
                  </h4>
                  <p class="mb-0 text-muted" th:text="${admin.schoolName} ?: '学校名未設定'">学校名</p>
                </div>
              </div>
              <div class="d-flex gap-2">
                <a th:href="@{/users}" class="btn btn-outline-secondary d-flex align-items-center gap-2">
                  <i class="bi bi-arrow-left"></i>
                  <span>ユーザー一覧へ戻る</span>
                </a>
                <a th:href="@{/users/edit/{id}(id=${admin.id})}" class="btn btn-primary d-flex align-items-center gap-2">
                  <i class="bi bi-pencil"></i>
                  <span>編集</span>
                </a>
              </div>
            </div>

            <!-- Admin Info Section -->
            <div class="px-4 pb-3">
              <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                  <h5 class="mb-0"><i class="bi bi-info-circle me-2 text-primary"></i>アカウント情報</h5>
                </div>
                <div class="card-body">
                  <div class="row">
                    <div class="col-md-3 mb-3">
                      <label class="form-label text-muted small">ユーザーID</label>
                      <p class="fw-semibold" th:text="${admin.userId}">USR-XXXX</p>
                    </div>
                    <div class="col-md-3 mb-3">
                      <label class="form-label text-muted small">ユーザー名</label>
                      <p class="fw-semibold" th:text="${admin.username}">Admin Name</p>
                    </div>
                    <div class="col-md-3 mb-3">
                      <label class="form-label text-muted small">メールアドレス</label>
                      <p class="fw-semibold" th:text="${admin.email}">email@example.com</p>
                    </div>
                    <div class="col-md-3 mb-3">
                      <label class="form-label text-muted small">ロール</label>
                      <p class="fw-semibold">
                        <span class="badge" th:classappend="${admin.role.name() == 'ADMIN'} ? 'bg-primary' : 'bg-secondary'"
                              th:text="${admin.role.name() == 'ADMIN'} ? '管理者' : 'ゲスト'">管理者</span>
                      </p>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-md-3 mb-3">
                      <label class="form-label text-muted small">学校名</label>
                      <p class="fw-semibold" th:text="${admin.schoolName} ?: '未設定'">School Name</p>
                    </div>
                    <div class="col-md-3 mb-3">
                      <label class="form-label text-muted small">作成日</label>
                      <p class="fw-semibold" th:text="${#temporals.format(admin.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</p>
                    </div>
                    <div class="col-md-3 mb-3">
                      <label class="form-label text-muted small">生徒数</label>
                      <p class="fw-semibold">
                        <span class="badge bg-info" th:text="${studentCount} + ' 名'">0 名</span>
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Students Section -->
            <div class="px-4 pb-3 flex-grow-1">
              <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                  <h5 class="mb-0"><i class="bi bi-people me-2 text-success"></i>登録生徒一覧</h5>
                  <span class="badge bg-primary" th:text="${studentCount} + ' 名'">0 名</span>
                </div>
                <div class="card-body p-0">
                  <div th:if="${#lists.isEmpty(students)}" class="text-center py-5 text-muted">
                    <i class="bi bi-inbox fs-1 mb-3"></i>
                    <p>この管理者が登録した生徒はいません</p>
                  </div>
                  
                  <div th:unless="${#lists.isEmpty(students)}" class="table-responsive">
                    <table class="table table-hover mb-0">
                      <thead class="table-light">
                        <tr>
                          <th>生徒ID</th>
                          <th>氏名</th>
                          <th>性別</th>
                          <th>生年月日</th>
                          <th>電話番号</th>
                          <th>在籍ステータス</th>
                          <th>登録日</th>
                          <th>操作</th>
                        </tr>
                      </thead>
                      <tbody>
                        <tr th:each="student : ${students}">
                          <td>
                            <span class="fw-semibold" th:text="${student.studentId}">STU001</span>
                          </td>
                          <td>
                            <span th:text="${student.studentName}">山田太郎</span>
                          </td>
                          <td>
                            <span th:text="${student.gender} ?: '-'">男性</span>
                          </td>
                          <td>
                            <span th:text="${student.dateOfBirth} ?: '-'">2000-01-01</span>
                          </td>
                          <td>
                            <span th:text="${student.phoneNumber} ?: '-'">090-1234-5678</span>
                          </td>
                          <td>
                            <span class="badge" 
                                  th:classappend="${student.registrationStatus != null && student.registrationStatus.name() == 'ACCEPTED'} ? 'bg-success' : 'bg-warning'"
                                  th:text="${student.registrationStatus != null ? (student.registrationStatus.name() == 'ACCEPTED' ? '在校' : '申請中') : '-'}">
                              在校
                            </span>
                          </td>
                          <td>
                            <span th:text="${student.createdAt} ?: '-'">2024-01-01</span>
                          </td>
                          <td>
                            <a th:href="@{/students/detail/{id}(id=${student.id})}" class="btn btn-sm btn-outline-primary">
                              <i class="bi bi-eye"></i> 詳細
                            </a>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/users-sidebar.js}"></script>
</body>

</html>
