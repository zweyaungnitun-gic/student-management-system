<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'GCG | ' + #{registration.form}">GCG | 登録フォーム</title>
    <link rel="icon" type="image/png" href="/images/image.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/register-btn-fixed-width.css">
    <link rel="stylesheet" th:if="${layoutType == 'admin'}" th:href="@{/css/dashboard.css}" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/register-radio-icons.js" defer></script>
    <script src="/js/register-displayValidationErrors.js" defer></script>
    <script src="/js/register-register.js" defer></script>
    <script src="/js/register-blockFutureDate.js" defer></script>
</head>


<body th:class="${layoutType == 'admin' ? '' : 'bg-light'}">
    <th:block th:if="${layoutType == 'admin'}">
        <div class="dashboard-layout">
            <div th:replace="~{layouts/admin-dashboard :: sidebar(currentPage='students')}"></div>
            <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>
            <div class="dashboard-main">
                <div
                    th:replace="~{layouts/admin-dashboard :: topbar(pageTitle=#{registration.form}, pageSubtitle=#{nav.students}, actionsFragment=~{this :: topbar-actions})}">
                </div>
                <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
                    <div th:replace="~{this :: form-content}"></div>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const layout = document.querySelector(".dashboard-layout");
                const toggles = document.querySelectorAll("[data-sidebar-toggle]");
                toggles.forEach((btn) =>
                    btn.addEventListener("click", function (event) {
                        event.preventDefault();
                        layout?.classList.toggle("sidebar-open");
                    })
                );
            })
        </script>
    </th:block>

    <th:block th:unless="${layoutType == 'admin'}">
        <th:block th:fragment="topbar-actions">
            <a th:href="@{/students}" class="btn btn-secondary d-flex align-items-center gap-2 rounded py-1 px-3">
                <i class="bi bi-arrow-left"></i>
                <span th:text="#{registration.back.to.student.list}">生徒一覧へ戻る</span>
            </a>
        </th:block>

        <th:block th:fragment="form-content">
            <!-- FORM_CONTENT_START -->
            <div class="container py-5">



                <!-- Registration Form -->
                <div class="card p-4 mx-auto rounded-3 shadow-sm border-0"
                    th:classappend="${layoutType == 'admin'} ? 'glass-panel' : ''" style="max-width: 900px;">
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <h2 class="text-dark fw-bold pb-3 mb-4">
                                <span th:text="#{registration.form}">生徒情報登録フォーム</span>
                            </h2>
                        </div>
                        <!-- form start -->
                        <form novalidate th:action="${layoutType == 'admin' ? '/admin/students/create/step1' : ''}"
                            th:method="${layoutType == 'admin' ? 'post' : ''}"
                            th:data-next-url="${layoutType == 'admin' ? '/admin/students/create/second-page' : '/register/second-page'}">
                            <div class="row justify-content-center">
                                <div class="col-12 col-lg-10 col-xl-9">
                                    <!-- Student Name (required) -->
                                    <div class="row mb-3">
                                        <label for="studentName"
                                            class="col-md-4 col-form-label sidebar-label text-dark mt-1">
                                            <span th:text="#{registration.student.name}">生徒名</span><span
                                                class="text-danger ms-1">*</span>
                                        </label>
                                        <div class="col-md-8">
                                            <input maxlength="100" type="text"
                                                class="form-control compact-field bg-light border-0 py-2 px-3"
                                                id="studentName" name="student.studentName"
                                                th:value="${studentCreateWizard?.student?.studentName}"
                                                th:placeholder="#{registration.student.name.placeholder}" required>
                                            <div class="invalid-feedback"
                                                th:text="#{registration.student.name.required}">
                                                生徒名は必須です</div>
                                        </div>
                                    </div>
                                    <!-- Date of Birth (required) -->
                                    <div class="row mb-3">
                                        <label for="dateOfBirth"
                                            class="col-md-4 col-form-label sidebar-label text-dark mt-1">
                                            <span th:text="#{registration.date.of.birth}">生年月日</span><span
                                                class="text-danger ms-1">*</span>
                                        </label>
                                        <div class="col-md-8">
                                            <input type="date"
                                                class="form-control compact-field bg-light border-0 py-2 px-3"
                                                id="dateOfBirth" name="student.dateOfBirth"
                                                th:value="${studentCreateWizard?.student?.dateOfBirth}" required>
                                            <div class="invalid-feedback" th:text="#{register.register.auto_290b}">
                                                生年月日は必須です
                                            </div>
                                        </div>
                                    </div>
                                    <!-- Gender (required) -->
                                    <div class="row mb-3">
                                        <label class="col-md-4 col-form-label sidebar-label text-dark mt-1">
                                            <span th:text="#{registration.gender}">性別</span><span
                                                class="text-danger ms-1">*</span>
                                        </label>
                                        <div class="col-md-8">
                                            <div class="btn-group" role="group" aria-label="Gender selection"
                                                id="genderBtnGroup">
                                                <input type="radio" class="btn-check" name="student.gender"
                                                    id="genderMale" value="男性"
                                                    th:checked="${studentCreateWizard?.student?.gender == '男性'}"
                                                    required>
                                                <label
                                                    class="btn btn-outline-primary fw-semibold d-flex align-items-center gap-1 me-2 rounded py-1 px-3 btn-fixed-width-small"
                                                    for="genderMale">
                                                    <i class="bi bi-circle"></i>
                                                    <th:block th:text="#{register.register.auto_cd9f}">男性</th:block>
                                                </label>
                                                <input type="radio" class="btn-check" name="student.gender"
                                                    id="genderFemale" value="女性"
                                                    th:checked="${studentCreateWizard?.student?.gender == '女性'}"
                                                    required>
                                                <label
                                                    class="btn btn-outline-primary fw-semibold d-flex align-items-center gap-1 rounded py-1 px-3 btn-fixed-width-small"
                                                    for="genderFemale">
                                                    <i class="bi bi-circle"></i>
                                                    <th:block th:text="#{register.register.auto_188e}">女性</th:block>
                                                </label>
                                            </div>
                                            <div class="invalid-feedback" id="genderError" style="display: none"
                                                th:text="#{register.register.auto_aa5d}">性別を選択してください</div>
                                        </div>
                                    </div>
                                    <!-- Current Living Address (required) -->
                                    <div class="row mb-3">
                                        <label for="currentLivingAddress"
                                            class="col-md-4 col-form-label sidebar-label text-dark mt-1">
                                            <span th:text="#{registration.current.address}">現在所</span><span
                                                class="text-danger ms-1">*</span>
                                        </label>
                                        <div class="col-md-8">
                                            <textarea class="form-control compact-field bg-light border-0 py-2 px-3"
                                                id="currentLivingAddress" name="student.currentLivingAddress" rows="3"
                                                style="border-radius: 16px;"
                                                th:placeholder="#{placeholder.student.current.address}"
                                                th:text="${studentCreateWizard?.student?.currentLivingAddress}"
                                                required></textarea>
                                            <div class="invalid-feedback" th:text="#{register.register.auto_1178}">
                                                現在所は必須です
                                            </div>
                                        </div>
                                    </div>
                                    <!-- Home Town Address (required) -->
                                    <div class="row mb-3">
                                        <label for="homeTownAddress"
                                            class="col-md-4 col-form-label sidebar-label text-dark mt-1">
                                            <span th:text="#{registration.hometown.address}">出身地住所</span><span
                                                class="text-danger ms-1">*</span>
                                        </label>
                                        <div class="col-md-8">
                                            <textarea class="form-control compact-field bg-light border-0 py-2 px-3"
                                                id="homeTownAddress" name="student.homeTownAddress" rows="3"
                                                style="border-radius: 16px;"
                                                th:placeholder="#{placeholder.student.hometown.address}"
                                                th:text="${studentCreateWizard?.student?.homeTownAddress}"
                                                required></textarea>
                                            <div class="invalid-feedback" th:text="#{register.register.auto_760e}">
                                                出身地住所は必須です</div>
                                        </div>
                                    </div>
                                    <!-- Phone Number (required) -->
                                    <div class="row mb-3">
                                        <label for="phoneNumber"
                                            class="col-md-4 col-form-label sidebar-label text-dark mt-1">
                                            <span th:text="#{registration.phone.number}">電話番号</span><span
                                                class="text-danger ms-1">*</span>
                                        </label>
                                        <div class="col-md-8">
                                            <input type="text"
                                                class="form-control compact-field bg-light border-0 py-2 px-3"
                                                id="phoneNumber" name="student.phoneNumber"
                                                th:value="${studentCreateWizard?.student?.phoneNumber}"
                                                th:placeholder="#{placeholder.student.phone.enter}" required>
                                            <div class="invalid-feedback" th:text="#{register.register.auto_4782}">
                                                電話番号は必須です
                                            </div>
                                        </div>
                                    </div>
                                    <!-- National ID (required) -->
                                    <div class="row mb-4">
                                        <label for="nationalId"
                                            class="col-md-4 col-form-label sidebar-label text-dark mt-1">
                                            <span th:text="#{registration.national.id}">国民 ID 番号</span><span
                                                class="text-danger ms-1">*</span>
                                        </label>
                                        <div class="col-md-8">
                                            <input type="text"
                                                class="form-control compact-field bg-light border-0 py-2 px-3"
                                                id="nationalId" name="student.nationalId"
                                                th:value="${studentCreateWizard?.student?.nationalId}"
                                                th:placeholder="#{placeholder.student.national.id.enter}" required>
                                            <div class="invalid-feedback" th:text="#{register.register.auto_d1d7}">
                                                国民ID番号は必須です</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- Submit Button -->
                            <div class="text-center pt-3">
                                <button type="submit" class="btn btn-primary rounded-pill py-2 px-5 fw-bold shadow-sm"
                                    th:text="#{register.register.auto_0e03}">次へ</button>
                            </div>
                        </form>
                        <!-- Footer Section -->
                        <div class="text-center mt-5 pt-3 border-top border-light">
                            <small class="text-muted">
                                &copy; 2025 Global Innovation Consulting.Inc, All Rights Reserved.
                            </small>
                        </div>
                    </div>
                </div>

            </div>

            <!-- FORM_CONTENT_END -->
        </th:block>
    </th:block>
</body>


</html>
