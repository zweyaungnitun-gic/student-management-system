<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'GCG | ' + #{registration.title}">GCG | 登録フォーム</title>
    <link rel="icon" type="image/png" href="/images/image.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/register-btn-fixed-width.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/register-radio-icons.js" defer></script>
    <script src="/js/register-displayValidationErrors.js" defer></script>
    <script src="/js/register-second-page.js" defer></script>
</head>

<body class="bg-light">
    <div class="container py-5">
        <!-- Registration Form -->
        <div class="card p-4 mx-auto rounded-3 shadow-sm" style="max-width: 900px;">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-white mb-3"
                        style="width: 100px; height: 100px; overflow: hidden;">
                        <img src="/images/image.png" alt="Logo" class="w-100 h-100" style="object-fit: cover;">
                    </div>
                    <h2 class="text-primary fw-bold pb-2 border-bottom border-light mb-4" th:text="#{registration.form}">
                        生徒情報登録フォーム
                    </h2>
                </div>
                <!-- Form Start -->
                <form novalidate>
                    <div class="row justify-content-center">
                        <div class="col-12 col-lg-10 col-xl-9">
                            <!-- Father Name (required) -->
                            <div class="row mb-3">
                                <label for="fatherName" class="col-md-4 col-form-label fw-bold" th:text="#{registration.father.name} + '*'">
                                    父親名<span class="text-danger ms-1">*</span>
                                </label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control" id="fatherName" name="fatherName"
                                        th:value="${studentCreateWizard?.additional?.fatherName}" th:placeholder="#{registration.father.name.placeholder}" required>
                                    <div class="invalid-feedback" th:text="#{validation.father.name.required}">父親名は必須です</div>
                                </div>
                            </div>
                            <!-- Passport Number (optional) -->
                            <div class="row mb-3">
                                <label for="passportNumber" class="col-md-4 col-form-label fw-bold" th:text="#{registration.passport.number}">
                                    パスポート番号
                                </label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control" id="passportNumber" name="passportNumber"
                                        th:value="${studentCreateWizard?.additional?.passportNumber}" th:placeholder="#{placeholder.student.passport}">
                                    <div class="invalid-feedback" th:text="#{register.second-page.auto_93eb}">パスポート番号の形式が正しくありません</div>
                                </div>
                            </div>
                            <!-- Guardian Phone Number (required) -->
                            <div class="row mb-3">
                                <label for="secondaryPhone" class="col-md-4 col-form-label fw-bold">
                                    保護者電話番号<span class="text-danger ms-1">*</span>
                                </label>
                                <div class="col-md-8">
                                    <input type="text" class="form-control" id="secondaryPhone" name="secondaryPhone"
                                        th:value="${studentCreateWizard?.additional?.secondaryPhone}" th:placeholder="#{placeholder.student.guardian.phone}" required>
                                    <div class="invalid-feedback" th:text="#{register.second-page.auto_5d4c}">保護者電話番号は必須です</div>
                                </div>
                            </div>
                            <!-- Current JLPT Level (optional) -->
                            <div class="row mb-3">
                                <label class="col-md-4 col-form-label fw-bold" th:text="#{register.second-page.auto_5393}">現在のJLPT合格レベル</label>
                                <div class="col-md-8">
                                    <div class="btn-group" role="group" aria-label="JLPT selection"
                                        id="jlptLevelBtnGroup">
                                        <input type="radio" class="btn-check" name="passedHighestJlptLevel" id="jlptNone" value="なし"
                                            th:checked="${studentCreateWizard?.additional?.passedHighestJlptLevel == 'なし'}">
                                        <label
                                            class="btn btn-outline-secondary d-flex align-items-center gap-1 me-2 rounded py-1 btn-fixed-width-small"
                                            for="jlptNone">
                                            <i class="bi bi-circle"></i><th:block th:text="#{register.second-page.auto_3609}">なし</th:block></label>
                                        <input type="radio" class="btn-check" name="passedHighestJlptLevel" id="jlptN5" value="N5"
                                            th:checked="${studentCreateWizard?.additional?.passedHighestJlptLevel == 'N5'}">
                                        <label
                                            class="btn btn-outline-secondary d-flex align-items-center gap-1 me-2 rounded py-1 px-2 md:px-3 btn-fixed-width-small"
                                            for="jlptN5">
                                            <i class="bi bi-circle"></i>
                                            N5
                                        </label>
                                        <input type="radio" class="btn-check" name="passedHighestJlptLevel" id="jlptN4" value="N4"
                                            th:checked="${studentCreateWizard?.additional?.passedHighestJlptLevel == 'N4'}">
                                        <label
                                            class="btn btn-outline-secondary d-flex align-items-center gap-1 rounded py-1 px-2 md:px-3 btn-fixed-width-small"
                                            for="jlptN4">
                                            <i class="bi bi-circle"></i>
                                            N4
                                        </label>
                                    </div>
                                    <div class="invalid-feedback" id="jlptLevelError" style="display:none;" th:text="#{register.second-page.auto_c4bc}">JLPTレベルを選択してください</div>
                                </div>
                            </div>
                            <!-- Desired Occupation (optional) -->
                            <div class="row mb-3">
                                <label class="col-md-4 col-form-label fw-bold" th:text="#{register.second-page.auto_fe09}">希望職種</label>
                                <div class="col-md-8">
                                    <div role="group" aria-label="Desired occupation selection"
                                        id="desiredOccupationBtnGroup" class="d-flex flex-column">
                                <!-- first row: 3 options -->
                                        <div class="d-flex gap-2 mb-2">
                                            <div>
                                                <input type="radio" class="btn-check" name="desiredJobType"
                                                    id="occCare" value="介護"
                                                    th:checked="${studentCreateWizard?.additional?.desiredJobType == '介護'}">
                                                <label
                                                    class="btn btn-outline-secondary d-flex align-items-center gap-1 rounded py-1  px-2 md:px-3 btn-fixed-width-small"
                                                     for="occCare">
                                                    <i class="bi bi-circle"></i><th:block th:text="#{register.second-page.auto_eb53}">介護</th:block></label>
                                            </div>
                                            <div>
                                                <input type="radio" class="btn-check" name="desiredJobType"
                                                    id="occGaiShoku" value="外食"
                                                    th:checked="${studentCreateWizard?.additional?.desiredJobType == '外食'}">
                                                <label
                                                    class="btn btn-outline-secondary d-flex align-items-center gap-1 rounded py-1 px-2 md:px-3 btn-fixed-width-small"
                                                    for="occGaiShoku">
                                                    <i class="bi bi-circle"></i><th:block th:text="#{register.second-page.auto_fdd8}">外食</th:block></label>
                                            </div>
                                            <div>
                                                <input type="radio" class="btn-check" name="desiredJobType"
                                                    id="occHotel" value="宿泊"
                                                    th:checked="${studentCreateWizard?.additional?.desiredJobType == '宿泊'}">
                                                <label
                                                    class="btn btn-outline-secondary d-flex align-items-center gap-1 rounded py-1 px-2 md:px-3 btn-fixed-width-small"
                                                    for="occHotel">
                                                    <i class="bi bi-circle"></i><th:block th:text="#{register.second-page.auto_9019}">宿泊</th:block></label>
                                            </div>
                                        </div>
                                        <!-- second row: 2 options -->
                                        <div class="d-flex gap-2">
                                            <div>
                                                <input type="radio" class="btn-check" name="desiredJobType"
                                                    id="occNone" value="わからない"
                                                    th:checked="${studentCreateWizard?.additional?.desiredJobType == 'わからない'}">
                                                <label
                                                    class="btn btn-outline-secondary d-flex align-items-center gap-1 rounded py-1 px-2 md:px-3 btn-fixed-width-small"
                                                    for="occNone">
                                                    <i class="bi bi-circle"></i><th:block th:text="#{register.second-page.auto_d4d5}">わからない</th:block></label>
                                            </div>
                                            <div>
                                                <input type="radio" class="btn-check" name="desiredJobType"
                                                    id="occOther" value="その他"
                                                    th:checked="${studentCreateWizard?.additional?.desiredJobType == 'その他'}">
                                                <label
                                                    class="btn btn-outline-secondary d-flex align-items-center gap-1 rounded py-1 px-2 md:px-3 btn-fixed-width-small"
                                                    for="occOther">
                                                    <i class="bi bi-circle"></i><th:block th:text="#{register.second-page.auto_02e9}">その他</th:block></label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="invalid-feedback" id="desiredOccupationError" style="display:none;" th:text="#{register.second-page.auto_6303}">希望職種を選択してください</div>
                                </div>
                            </div>
                            <!-- Other Occupation (optional) -->
                            <div class="row mb-3">
                                <label for="otherOccupation" class="col-md-4 col-form-label fw-bold" th:text="#{register.second-page.auto_e025}">その他職種</label>
                                <div class="col-md-8">
                                    <textarea class="form-control" id="otherDesiredJobType" name="otherDesiredJobType" rows="3"
                                        th:placeholder="#{placeholder.student.occupation.other}"
                                        th:text="${studentCreateWizard?.additional?.otherDesiredJobType}"></textarea>
                                    <div class="invalid-feedback" th:text="#{register.second-page.auto_d1e6}">その他職種は200文字以内で入力してください</div>
                                </div>
                            </div>
                            <!-- Japan Travel Experience (optional) -->
                            <div class="row mb-3">
                                <label class="col-md-4 col-form-label fw-bold" th:text="#{register.second-page.auto_e430}">日本渡航経験</label>
                                <div class="col-md-8">
                                    <div class="btn-group" role="group" aria-label="Japan travel experience"
                                        id="japanTravelExperienceBtnGroup">
                                        <input type="radio" class="btn-check" name="japanTravelExperience"
                                            id="travelYes" value="true" th:checked="${studentCreateWizard?.additional?.japanTravelExperience == true}">
                                        <label
                                            class="btn btn-outline-secondary d-flex align-items-center gap-1 me-2 rounded py-1 btn-fixed-width-small"
                                            for="travelYes">
                                            <i class="bi bi-circle"></i><th:block th:text="#{register.second-page.auto_b834}">ある</th:block></label>
                                        <input type="radio" class="btn-check" name="japanTravelExperience" id="travelNo"
                                            value="false" th:checked="${studentCreateWizard?.additional?.japanTravelExperience == false}">
                                        <label
                                            class="btn btn-outline-secondary d-flex align-items-center gap-1 rounded py-1  btn-fixed-width-small"
                                            for="travelNo">
                                            <i class="bi bi-circle"></i><th:block th:text="#{register.second-page.auto_e2bb}">ない</th:block></label>
                                    </div>
                                    <div class="invalid-feedback" id="japanTravelExperienceError" style="display:none;" th:text="#{register.second-page.auto_fd6c}">日本渡航経験を選択してください</div>
                                </div>
                            </div>
                            <!-- COE Application Experience (optional) -->
                            <div class="row mb-4">
                                <label class="col-md-4 col-form-label fw-bold" th:text="#{register.second-page.auto_3dd2}">COE申請経験</label>
                                <div class="col-md-8">
                                    <div class="btn-group" role="group" aria-label="COE application experience"
                                        id="coeApplicationExperienceBtnGroup">
                                        <input type="radio" class="btn-check" name="coeApplicationExperience"
                                            id="coeYes" value="true" th:checked="${studentCreateWizard?.additional?.coeApplicationExperience == true}">
                                        <label
                                            class="btn btn-outline-secondary d-flex align-items-center gap-1 me-2 rounded py-1 btn-fixed-width-small"
                                            for="coeYes">
                                            <i class="bi bi-circle"></i><th:block th:text="#{register.second-page.auto_b834}">ある</th:block></label>
                                        <input type="radio" class="btn-check" name="coeApplicationExperience" id="coeNo"
                                            value="false" th:checked="${studentCreateWizard?.additional?.coeApplicationExperience == false}">
                                        <label
                                            class="btn btn-outline-secondary d-flex align-items-center gap-1 rounded py-1 btn-fixed-width-small"
                                            for="coeNo">
                                            <i class="bi bi-circle"></i><th:block th:text="#{register.second-page.auto_e2bb}">ない</th:block></label>
                                    </div>
                                    <div class="invalid-feedback" id="coeApplicationExperienceError"
                                        style="display:none;" th:text="#{register.second-page.auto_f1b9}">COE申請経験を選択してください</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Submit Button -->
                    <div class="text-center pt-3 d-flex justify-content-center gap-3">
                        <button type="button" class="btn btn-secondary btn-lg rounded py-1 px-3"
                            id="backButton" th:text="#{register.second-page.auto_4a62}">戻る</button>
                        <button type="submit" class="btn btn-primary btn-lg rounded py-1 px-3" th:text="#{register.second-page.auto_0e03}">次へ</button>
                    </div>
                </form>
                <!-- Footer Section-->
                <div class="text-center mt-5 pt-3 border-top border-light">
                    <small class="text-muted">
                        &copy; 2025 Global Innovation Consulting.Inc, All Rights Reserved.
                    </small>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
