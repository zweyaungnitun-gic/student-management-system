<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layouts/admin-layout :: head(pageTitle=${test.testId == null} ? '新規テスト作成' : 'テスト編集')}">
</head>

<body>
    <div class="dashboard-layout">
        <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage='tests')}"></th:block>

        <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

        <div class="dashboard-main">
            <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
                <div class="page-header mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light btn-icon d-lg-none" type="button" data-sidebar-toggle>
                            <i class="bi bi-list fs-4"></i>
                        </button>
                        <div>
                            <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem;">
                                <span th:if="${test.testId == null}" th:text="#{tests.form.auto_8375}">新規テスト作成</span>
                                <span th:unless="${test.testId == null}" th:text="#{tests.form.auto_c47f}">テスト編集</span>
                            </h1>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-journal-plus me-2 text-primary"></i>
                            <th:block th:text="#{tests.form.auto_e59d}">テスト情報入力</th:block>
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{${test.testId == null} ? '/tests/add' : '/tests/edit/' + ${test.testId}}"
                              th:object="${test}" method="post" class="needs-validation" novalidate>

                            <input type="hidden" name="_method" value="post" />
                            <input type="hidden" th:field="*{testId}" />

                            <!-- Course Selection -->
                            <div class="row mb-4">
                                <label class="col-sm-3 col-form-label fw-semibold">
                                    <span th:text="#{test.course}">コース</span> <span class="text-danger">*</span>
                                </label>
                                <div class="col-sm-9">
                                    <select th:field="*{courseId}" class="form-select" required>
                                        <option value="" th:text="#{test.course.placeholder}">-- コースを選択してください --</option>
                                        <option th:each="course : ${courses}" 
                                                th:value="${course.courseId}"
                                                th:text="${course.courseName} + ' (' + ${course.courseCode} + ')'">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <!-- Test Name -->
                            <div class="row mb-4">
                                <label class="col-sm-3 col-form-label fw-semibold">
                                    <span th:text="#{test.name}">テスト名</span> <span class="text-danger">*</span>
                                </label>
                                <div class="col-sm-9">
                                    <input type="text" th:field="*{testName}" class="form-control" 
                                           th:placeholder="#{test.name.placeholder}" required>
                                </div>
                            </div>

                            <!-- Description -->
                            <div class="row mb-4">
                                <label class="col-sm-3 col-form-label fw-semibold" th:text="#{test.description}">説明</label>
                                <div class="col-sm-9">
                                    <textarea th:field="*{description}" class="form-control" rows="4"
                                              th:placeholder="#{test.description.placeholder}"></textarea>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <!-- Total Marks -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">
                                        <span th:text="#{test.total.marks}">総合点</span> <span class="text-danger">*</span>
                                    </label>
                                    <input type="number" th:field="*{totalMarks}" class="form-control" min="1" required>
                                </div>

                                <!-- Passing Marks -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold" th:text="#{test.passing.marks}">合格点</label>
                                    <input type="number" th:field="*{passingMarks}" class="form-control" min="0">
                                    <small class="text-muted" th:text="#{test.passing.marks.hint}">※ 未入力の場合は合格/不合格の判定なし</small>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <!-- Test Date -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold" th:text="#{test.date}">試験日</label>
                                    <input type="datetime-local" th:field="*{testDate}" class="form-control">
                                    <small class="text-muted" th:text="#{test.date.hint}">※ 日時を選択してください</small>
                                </div>

                                <!-- Duration -->
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold" th:text="#{test.duration}">試験時間 (分)</label>
                                    <input type="number" th:field="*{durationMinutes}" class="form-control" min="1">
                                </div>
                            </div>

                            <!-- Creator Information -->
                            <div class="row mb-4">
                                <label class="col-sm-3 col-form-label fw-semibold" th:text="#{test.creator}">作成者情報</label>
                                <div class="col-sm-9">
                                    <div th:if="${test.testId != null}" class="bg-light p-3 rounded">
                                        <div class="d-flex align-items-center">
                                            <div class="bg-primary bg-opacity-10 p-3 rounded-circle me-3">
                                                <i class="bi bi-person-badge fs-4 text-primary"></i>
                                            </div>
                                            <div>
                                                <h6 class="mb-1" th:text="${test.createdByName} ?: 'システム'"></h6>
                                                <small class="text-muted" th:if="${test.createdAt != null}">
                                                    <span th:text="#{app.created.date}">作成日</span>: 
                                                    <span th:text="${#temporals.format(test.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                                                </small>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div th:if="${test.testId == null}" class="border rounded p-3">
                                        <label class="form-label fw-semibold" th:text="#{test.creator.select}">作成者を選択</label>
                                        <select name="teacherId" class="form-select">
                                            <option value="" th:text="#{test.creator.system}">-- システム管理者として作成 --</option>
                                            <option th:each="teacher : ${teachers}" 
                                                    th:value="${teacher.teacherId}"
                                                    th:text="${teacher.name} + ' (' + ${teacher.teacherCode} + ')'">
                                            </option>
                                        </select>
                                        <small class="text-muted d-block mt-2">
                                            <i class="bi bi-info-circle me-1"></i>
                                            <th:block th:text="#{test.creator.hint}">教師を選択すると、その教師が作成者として記録されます</th:block>
                                        </small>
                                    </div>
                                </div>
                            </div>

                            <!-- Info Alert -->
                            <div class="alert alert-info d-flex align-items-center mb-4" role="alert">
                                <i class="bi bi-info-circle-fill fs-4 me-3"></i>
                                <div>
                                    <strong th:text="#{test.note}">注意事項</strong><br>
                                    <th:block th:text="#{test.note.cannot.change}">• 作成者は後から変更できません</th:block>
                                </div>
                            </div>

                            <!-- Form Actions -->
                            <div class="row mt-5">
                                <div class="col-sm-9 offset-sm-3">
                                    <a href="/tests" class="btn btn-outline-secondary px-5 py-2 ms-3">
                                        <i class="bi bi-x-circle me-2"></i><span th:text="#{test.cancel}">キャンセル</span>
                                    </a>
                                    <button type="submit" class="btn btn-primary px-5 py-2">
                                        <i class="bi bi-check-circle me-2"></i><span th:text="#{test.save}">保存</span>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
