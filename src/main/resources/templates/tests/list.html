<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layouts/admin-layout :: head(pageTitle='テスト管理 | 生徒情報管理システム')}">
</head>

<body>
    <div class="dashboard-layout">
        <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage='tests')}"></th:block>

        <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

        <div class="dashboard-main">
            <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
                <!-- Page Header -->
                <div class="page-header mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light btn-icon d-lg-none" type="button" data-sidebar-toggle>
                            <i class="bi bi-list fs-4"></i>
                        </button>
                        <div>
                            <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem;">
                                テスト管理
                            </h1>
                        </div>
                    </div>
                </div>

                <!-- Search and Action Buttons -->
                <div class="card mb-4 shadow-sm">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <form th:action="@{/tests}" method="get" class="row g-3">
                                    <div class="col-md-7">
                                        <div class="input-group">
                                            <span class="input-group-text bg-white">
                                                <i class="bi bi-search"></i>
                                            </span>
                                            <input type="text" class="form-control" name="search" th:value="${search}"
                                                   placeholder="テスト名またはコース名で検索...">
                                        </div>
                                    </div>
                                    <div class="col-md-3">
                                        <select class="form-select" name="courseId">
                                            <option value="">全てのコース</option>
                                            <option th:each="course : ${courses}"
                                                    th:value="${course.courseId}"
                                                    th:text="${course.courseName}"
                                                    th:selected="${course.courseId == selectedCourseId}">
                                            </option>
                                        </select>
                                    </div>
                                    <div class="col-md-2">
                                        <button type="submit" class="btn btn-primary w-100">
                                            <i class="bi bi-search me-2"></i>検索
                                        </button>
                                    </div>
                                </form>
                            </div>
                            <div class="col-md-4">
                                <div class="d-flex gap-2 justify-content-end">
                                    <a href="/tests/add" class="btn btn-success d-flex align-items-center gap-2"
                                       sec:authorize="hasRole('ADMIN') or hasRole('TEACHER')">
                                        <i class="bi bi-plus-circle"></i>
                                        <span>新規テスト</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Messages -->
                <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Tests Table -->
                <div class="card shadow-sm">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="testTable">
                                <thead class="bg-primary text-white">
                                    <tr>
                                        <th class="text-center">ID</th>
                                        <th class="text-center">テスト名</th>
                                        <th class="text-center">コース</th>
                                        <th class="text-center">総合点</th>
                                        <th class="text-center">合格点</th>
                                        <th class="text-center">試験日</th>
                                        <th class="text-center">作成者</th>
                                        <th class="text-center">操作</th>
                                    </tr>
                                </thead>
                                <tbody id="testTableBody">
                                    <tr th:each="test : ${tests}">
                                        <td class="text-center" th:text="${test.testId}"></td>
                                        <td th:text="${test.testName}"></td>
                                        <td>
                                            <span class="badge bg-info bg-opacity-10 text-info px-3 py-2 rounded-pill"
                                                  th:text="${test.courseName}"></span>
                                        </td>
                                        <td class="text-center" th:text="${test.totalMarks}"></td>
                                        <td class="text-center" th:text="${test.passingMarks} ?: '-'"></td>
                                        <td class="text-center" th:text="${#temporals.format(test.testDate, 'yyyy/MM/dd')} ?: '-'"></td>
                                        <td th:text="${test.createdByName} ?: '-'"></td>
                                        <td class="text-center">
                                            <div class="d-flex gap-2 justify-content-center">
                                                <a th:href="@{'/tests/' + ${test.testId}}" 
                                                   class="btn btn-sm btn-outline-info" title="詳細">
                                                    <i class="bi bi-info-circle"></i>
                                                </a>
                                                <a th:href="@{'/tests/edit/' + ${test.testId}}" 
                                                   class="btn btn-sm btn-outline-primary" title="編集"
                                                   sec:authorize="hasRole('ADMIN') or hasRole('TEACHER')">
                                                    <i class="bi bi-pencil-square"></i>
                                                </a>
                                                <a th:href="@{'/results/test/' + ${test.testId}}" 
                                                   class="btn btn-sm btn-outline-success" title="結果">
                                                    <i class="bi bi-bar-chart"></i>
                                                </a>
                                                <a th:href="@{'/results/add/' + ${test.testId}}" 
                                                   class="btn btn-sm btn-outline-warning" title="結果追加"
                                                   sec:authorize="hasRole('ADMIN') or hasRole('TEACHER')">
                                                    <i class="bi bi-plus-circle"></i>
                                                </a>
                                                <a th:href="@{'/tests/delete/' + ${test.testId}}" 
                                                   class="btn btn-sm btn-outline-danger" title="削除"
                                                   sec:authorize="hasRole('ADMIN')"
                                                   onclick="return confirm('このテストを削除してもよろしいですか？');">
                                                    <i class="bi bi-trash-fill"></i>
                                                </a>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${tests.size() == 0}">
                                        <td colspan="8" class="text-center text-muted py-5">
                                            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                                            テストが登録されていません。
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <div id="pagination" class="d-flex justify-content-center mt-4"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/pagination.js}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const layout = document.querySelector(".dashboard-layout");
            const toggles = document.querySelectorAll("[data-sidebar-toggle]");
            toggles.forEach((btn) =>
                btn.addEventListener("click", function (event) {
                    event.preventDefault();
                    layout?.classList.toggle("sidebar-open");
                })
            );

            if (typeof initPagination === 'function') {
                initPagination('testTableBody', 10);
            }
        });
    </script>
</body>
</html>
