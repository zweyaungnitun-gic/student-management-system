<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layouts/admin-layout :: head(pageTitle=#{report.grade.summary} + ' | ' + #{app.title})}">
</head>

<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage='students')}"></th:block>

        <div class="sidebar-overlay d-lg-none" data-sidebar-toggle></div>

        <div class="dashboard-main">
            <div class="page-wrapper py-4 py-md-5 px-3 px-md-5">
                <!-- Page Header -->
                <div class="page-header mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light btn-icon d-lg-none" type="button" data-sidebar-toggle>
                            <i class="bi bi-list fs-4"></i>
                        </button>
                        <div>
                            <h1 class="mb-0" style="color: #0a58a0; font-weight: 600; font-size: 1.8rem;" th:text="#{report.grade.summary}">
                                成績サマリー
                            </h1>
                            <p class="text-muted mb-0" th:text="${gradeSummary.studentName} + ' (' + ${gradeSummary.studentIdNumber} + ')'"></p>
                        </div>
                    </div>
                </div>

                <!-- Summary Cards -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-primary bg-opacity-10">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="flex-shrink-0">
                                        <i class="bi bi-trophy fs-2 text-primary"></i>
                                    </div>
                                    <div class="flex-grow-1 ms-3">
                                        <h6 class="text-muted mb-1" th:text="#{reports.grade-summary.auto_330a}">総合GPA</h6>
                                        <h3 class="mb-0 fw-bold" th:text="${gradeSummary.overallGPA}">3.5</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-success bg-opacity-10">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="flex-shrink-0">
                                        <i class="bi bi-award fs-2 text-success"></i>
                                    </div>
                                    <div class="flex-grow-1 ms-3">
                                        <h6 class="text-muted mb-1" th:text="#{reports.grade-summary.auto_28c8}">総合評価</h6>
                                        <h3 class="mb-0 fw-bold" th:text="${gradeSummary.overallGrade}">A</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-info bg-opacity-10">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="flex-shrink-0">
                                        <i class="bi bi-check-circle fs-2 text-info"></i>
                                    </div>
                                    <div class="flex-grow-1 ms-3">
                                        <h6 class="text-muted mb-1" th:text="#{reports.grade-summary.auto_8492}">合格/不合格</h6>
                                        <h3 class="mb-0 fw-bold" th:text="${gradeSummary.passedTests} + '/' + ${gradeSummary.failedTests}">8/2</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="card shadow-sm border-0 bg-warning bg-opacity-10">
                            <div class="card-body">
                                <div class="d-flex align-items-center">
                                    <div class="flex-shrink-0">
                                        <i class="bi bi-bar-chart fs-2 text-warning"></i>
                                    </div>
                                    <div class="flex-grow-1 ms-3">
                                        <h6 class="text-muted mb-1" th:text="#{reports.grade-summary.auto_523c}">総テスト数</h6>
                                        <h3 class="mb-0 fw-bold" th:text="${gradeSummary.totalTests}">10</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Course-wise GPA -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-book me-2 text-primary"></i><th:block th:text="#{reports.grade-summary.auto_7222}">コース別成績</th:block></h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4" th:text="#{reports.grade-summary.auto_107b}">コース</th>
                                        <th class="text-center">GPA</th>
                                        <th class="text-center" th:text="#{reports.grade-summary.auto_6745}">評価</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="entry : ${gradeSummary.gpaByCourse}">
                                        <td class="ps-4" th:text="${entry.key}"></td>
                                        <td class="text-center">
                                            <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill"
                                                  th:text="${entry.value}"></span>
                                        </td>
                                        <td class="text-center">
                                            <span class="badge bg-success bg-opacity-10 text-success px-3 py-2 rounded-pill"
                                                  th:text="${gradeSummary.gradeByCourse[entry.key]}"></span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Detailed Test Results -->
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                        <h5 class="card-title mb-0">
                            <i class="bi bi-list-check me-2 text-success"></i><th:block th:text="#{reports.grade-summary.auto_f121}">テスト結果詳細</th:block></h5>
                        <a th:href="@{'/reports/report-card/' + ${gradeSummary.studentId}}" 
                           class="btn btn-sm btn-primary">
                            <i class="bi bi-file-text me-2"></i><th:block th:text="#{reports.grade-summary.auto_a0a4}">成績表を表示</th:block></a>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th class="ps-4" th:text="#{reports.grade-summary.auto_0355}">テスト名</th>
                                        <th class="text-center" th:text="#{reports.grade-summary.auto_d05f}">得点/満点</th>
                                        <th class="text-center" th:text="#{reports.grade-summary.auto_874c}">パーセンテージ</th>
                                        <th class="text-center" th:text="#{reports.grade-summary.auto_6745}">評価</th>
                                        <th class="text-center">GPA</th>
                                        <th class="text-center" th:text="#{reports.grade-summary.auto_54b7}">結果</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="result : ${gradeSummary.testResults}">
                                        <td class="ps-4" th:text="${result.testName}"></td>
                                        <td class="text-center" th:text="${result.scoreObtained} + '/' + ${result.totalMarks}"></td>
                                        <td class="text-center">
                                            <span th:text="${#numbers.formatDecimal(result.percentage, 1, 1)} + '%'"></span>
                                        </td>
                                        <td class="text-center">
                                            <span class="badge" 
                                                  th:classappend="${result.grade == 'A' or result.grade == 'A+' ? 'bg-success' : 
                                                                   (result.grade == 'F' ? 'bg-danger' : 'bg-info')}"
                                                  th:text="${result.grade}"></span>
                                        </td>
                                        <td class="text-center" th:text="${result.gpa}"></td>
                                        <td class="text-center">
                                            <span th:if="${result.result == '合格'}" 
                                                  class="badge bg-success" th:text="#{reports.grade-summary.auto_86f7}">合格</span>
                                            <span th:if="${result.result == '不合格'}" 
                                                  class="badge bg-danger" th:text="#{reports.grade-summary.auto_6e5a}">不合格</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>

                            <!-- After the table closing tag, add pagination -->
                            <div class="d-flex justify-content-center mt-4">
                                <nav aria-label="Page navigation">
                                    <ul class="pagination">
                                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled' : ''">
                                            <a class="page-link" th:href="@{/reports/student/{studentId}(studentId=${gradeSummary.studentId}, academicYear=${academicYear}, semester=${semester}, page=${currentPage - 1})}" 
                                            th:unless="${currentPage == 1}">
                                                &laquo;
                                            </a>
                                            <span class="page-link" th:if="${currentPage == 1}">&laquo;</span>
                                        </li>
                                        
                                        <li class="page-item" th:each="pageNum : ${#numbers.sequence(1, totalPages)}" 
                                            th:classappend="${pageNum == currentPage} ? 'active' : ''">
                                            <a class="page-link" th:href="@{/reports/student/{studentId}(studentId=${gradeSummary.studentId}, academicYear=${academicYear}, semester=${semester}, page=${pageNum})}" 
                                            th:text="${pageNum}"></a>
                                        </li>
                                        
                                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled' : ''">
                                            <a class="page-link" th:href="@{/reports/student/{studentId}(studentId=${gradeSummary.studentId}, academicYear=${academicYear}, semester=${semester}, page=${currentPage + 1})}" 
                                            th:unless="${currentPage == totalPages}">
                                                &raquo;
                                            </a>
                                            <span class="page-link" th:if="${currentPage == totalPages}">&raquo;</span>
                                        </li>
                                    </ul>
                                </nav>
                            </div>

                            <!-- Results count info -->
                            <div class="text-center text-muted small mt-2">
                                表示: <span th:text="${gradeSummary.testResults.size()}"></span>件 / 全<span th:text="${totalResults}"></span>件
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-4 d-flex justify-content-end gap-2">
                    <a th:href="@{'/students/detail/' + ${gradeSummary.studentId}}" 
                       class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-2"></i><th:block th:text="#{reports.grade-summary.auto_d4be}">生徒詳細に戻る</th:block></a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const layout = document.querySelector(".dashboard-layout");
            const toggles = document.querySelectorAll("[data-sidebar-toggle]");
            toggles.forEach((btn) =>
                btn.addEventListener("click", function (event) {
                    event.preventDefault();
                    layout?.classList.toggle("sidebar-open");
                })
            );
        });
    </script>
</body>
</html>
