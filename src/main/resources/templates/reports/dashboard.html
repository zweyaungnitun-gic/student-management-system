<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/admin-layout :: head(pageTitle='レポートダッシュボード')}">
</head>
<body>
    <div class="dashboard-layout">
        <th:block th:replace="~{layouts/admin-layout :: sidebar(currentPage='reports')}"></th:block>
        
        <div class="dashboard-main">
            <div class="page-wrapper py-4 px-4">
                <h1 class="mb-4">レポートダッシュボード</h1>
                
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">成績サマリー</h5>
                                <p class="card-text">学生ごとの成績サマリーを表示</p>
                                <form class="d-flex" onsubmit="window.location.href='/reports/student/' + document.getElementById('studentId').value; return false;">
                                    <input type="number" id="studentId" class="form-control me-2" placeholder="学生ID">
                                    <button type="submit" class="btn btn-primary">表示</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">成績表</h5>
                                <p class="card-text">PDF形式の成績表を表示</p>
                                <form class="d-flex" onsubmit="window.location.href='/reports/report-card/' + document.getElementById('reportStudentId').value; return false;">
                                    <input type="number" id="reportStudentId" class="form-control me-2" placeholder="学生ID">
                                    <button type="submit" class="btn btn-success">表示</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4 mb-3">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">クラス順位</h5>
                                <p class="card-text">クラス内の順位を表示</p>
                                <select id="className" class="form-select mb-2">
                                    <option value="N5">N5クラス</option>
                                    <option value="N4">N4クラス</option>
                                    <option value="N3">N3クラス</option>
                                    <option value="N2">N2クラス</option>
                                    <option value="N1">N1クラス</option>
                                </select>
                                <button class="btn btn-warning" onclick="window.location.href='/reports/rankings?className=' + document.getElementById('className').value">
                                    表示
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
