home.career.h3=Career Gatewayとのキャリアパス
home.career.description=GIC Career Gatewayでコースを修了した後、GIC社にインターンとして入社できます。インターン期間中も会社から給与10万チャットと交通費が支給されます。インターン期間は6ヶ月間です。インターン期間終了後、会社による評価で問題がなければ採用されます。また、あなたのスキルに合った日本のパートナーIT企業も紹介しますので、就職につながります。

