# Home Page (index.html)
home.title=GIC Career Gateway
home.hero.top=より良い未来のために
home.hero.title=GIC Career Gateway
home.hero.subtitle=リベラルアーツ・IT・日本語トレーニングセンター
home.hero.description=未来への一歩を踏み出しましょう：日本のIT業界でのキャリアを目指して。最新の技術と日本語スキルを学び、あなたの旅を始めましょう。
home.hero.register=今すぐ登録

home.about.h3=現代のITキャリアを支援するGIC Career Gateway
home.about.h4=GIC Career Gatewayのご紹介
home.about.p1=GIC Career Gatewayは2011年に設立され、ミャンマーに最高のITソリューションを提供できるITプロフェッショナルを育成することを目的としています。GICグループが設立した研修校で、2013年から生徒の指導を行っています。GICグループは2011年から国際水準の研修プログラムを実施しており、生徒の成功を常に最優先にしています。ITスキルのない生徒がキャリアパスを見つけられるよう支援します。
home.about.p2=ITスキルと関心を持つ方、教育とキャリアパスに目標を持つ方、IT業界でキャリアを積みたい方のために、奨学金プログラムも提供しています。
home.about.more=もっと見る >>

home.who.h3=誰のため？誰が参加すべきか？
home.who.h4=ITプロとして日本に渡航したいすべての若者のために
