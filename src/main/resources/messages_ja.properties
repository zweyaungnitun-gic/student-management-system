home.courses.h3=GIC Career Gatewayが提供するコース
home.courses.all1.title=オールインワン2年間コース
home.courses.all1.description=このコースでは、IT科目を基礎から実際に職場で使えるレベルまで日本語で指導します。卒業だけでなく、日本の国家試験であるITPPEC FE試験に合格できるよう訓練します。
