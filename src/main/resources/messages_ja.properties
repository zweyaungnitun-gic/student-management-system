home.who.item2=まだ卒業していないがITに関心のある方
home.who.item3=IT・日本語をゼロから学びたい方
home.who.item4=IT分野に転向したいITバックグラウンドを持つ方、またはITの職務経験があり日本での経験を積みたい方
home.who.item5=日本の語学学校を卒業した方
home.who.item6=日本でITエンジニアとして働きたい方

home.learn.h3=何を学ぶのか？
home.learn.h4=IT職場に到達するまで、GIC Career Gateway Japan IT Education & Bootcamp
